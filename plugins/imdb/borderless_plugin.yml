name: imdb
version: "1.0.0"
author: Borderless
description: Search IMDB for titles and post a formatted card
license: MIT
tags: [media, lookup]
min_bot_version: "3.1.9"
entry: imdb.py
python_dependencies:
  - imdbio
  - pycountry
commands:
  - name: imdb
    handler: imdb_search
    description: "[query] or ttxxxxxx Get IMDB info"
    usage: "/imdb <query|ttxxxxxxx>"
    access: authorized
callbacks:
  - pattern: "^imdb"
    handler: imdb_callback
    description: IMDB result navigation
    access: authorized
