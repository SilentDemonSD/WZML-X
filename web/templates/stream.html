<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#000003">
    <title>Stream · WZML-X</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22.5' fill='%23F5F7FF'/%3E%3Cpath d='M 19.4 42.6 C 20.0 55.4 22.4 66.4 29.8 68.3 C 37.0 70.1 43.2 61.0 45.2 48.8 C 47.5 61.0 53.4 66.6 61.0 68.3 C 68.6 70.0 75.6 55.5 80.6 35.3' fill='none' stroke='%233D87FF' stroke-width='11.1' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Tektur:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        @property --ang {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        :root {
            color-scheme: dark;
            --bg: #000003;
            --surface: #04040B;
            --surface-2: #07070F;
            --line: rgba(42, 95, 208, .28);
            --line-2: #2A5FD0;
            --text: #F5F7FF;
            --muted: #C3CBDF;
            --accent: #3D87FF;
            --accent-2: #5B9DFF;
            --accent-soft: #06153F;
            --r: 12px;
            --r-frame: 18px;
            --pad: clamp(.6rem, 2vw, 1.5rem);
            --bar-pad: 16px;
            --chrome: 16.5rem;
            --content: min(1240px,
                calc((100svh - var(--chrome)) * 16 / 9),
                calc(100vw - 2 * var(--pad)));
            --sans: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --display: 'Tektur', 'Montserrat', system-ui, sans-serif;
            --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace;
            --z-glyph: 0;
            --z-spot: 1;
            --z-dim: 2;
            --z-page: 3;
            --z-top: 30;
            --z-pop: 40;
            --z-toast: 70;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
        }

        body {
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            justify-content: safe center;
            overflow-x: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(42, 95, 208, .45);
            border-radius: 999px;
        }

        .veil {
            position: fixed;
            inset: 0;
            z-index: var(--z-glyph);
            pointer-events: none;
            opacity: .38;
            transition: opacity .45s ease;
            background:
                linear-gradient(rgba(42, 95, 208, .13) 1px, transparent 1px) 50% / 13px 13px,
                linear-gradient(90deg, rgba(42, 95, 208, .13) 1px, transparent 1px) 50% / 13px 13px,
                radial-gradient(circle at 50% 12%, rgba(61, 135, 255, .1), transparent 26%),
                radial-gradient(circle at 50% 94%, rgba(6, 21, 63, .55), transparent 44%);
        }

        .spot {
            position: fixed;
            inset: 0;
            z-index: var(--z-spot);
            pointer-events: none;
            opacity: 0;
            transition: opacity .35s ease;
            background:
                linear-gradient(rgba(245, 247, 255, .16) 1px, transparent 1px) 50% / 13px 13px,
                linear-gradient(90deg, rgba(245, 247, 255, .16) 1px, transparent 1px) 50% / 13px 13px;
            -webkit-mask-image: radial-gradient(circle 190px at var(--mx, -999px) var(--my, -999px),
                    rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, .45) 45%, transparent 72%);
            mask-image: radial-gradient(circle 190px at var(--mx, -999px) var(--my, -999px),
                    rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, .45) 45%, transparent 72%);
        }

        @media (hover: hover) and (pointer: fine) {
            body.tracking .spot {
                opacity: 1;
            }
        }

        body.dark .spot {
            opacity: 0;
        }

        .glyph {
            position: fixed;
            z-index: var(--z-glyph);
            font-family: var(--display);
            font-size: clamp(10rem, 22vw, 24rem);
            font-weight: 600;
            line-height: .8;
            letter-spacing: -.08em;
            color: #04081a;
            opacity: .72;
            filter: drop-shadow(0 0 42px rgba(0, 0, 3, .95));
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
            transition: opacity .45s ease;
            animation: fade 1.2s cubic-bezier(.16, 1, .3, 1) both;
        }

        .glyph::before {
            content: attr(data-letter);
            position: absolute;
            inset: 0;
            color: transparent;
            background:
                radial-gradient(circle at 40% 25%, rgba(93, 157, 255, .3), transparent 34%),
                radial-gradient(circle at 60% 75%, rgba(61, 135, 255, .11), transparent 36%),
                linear-gradient(rgba(245, 247, 255, .13), rgba(245, 247, 255, .03));
            -webkit-background-clip: text;
            background-clip: text;
            filter: blur(22px);
            opacity: .9;
            transform: scale(1.06);
        }

        .glyph::after {
            content: attr(data-letter);
            position: absolute;
            inset: 0;
            color: rgba(195, 203, 223, .1);
            text-shadow: 0 0 18px rgba(93, 157, 255, .1), 0 0 60px rgba(0, 0, 3, .95);
            transform: scale(1.01);
        }

        .glyph--w {
            top: 50%;
            left: clamp(.2rem, 1.2vw, 1.5rem);
            transform: translateY(-50%) scaleX(.92);
        }

        .glyph--x {
            top: 50%;
            right: clamp(.8rem, 2.5vw, 2.6rem);
            transform: translateY(-50%) scaleX(.92);
        }

        @keyframes fade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .dimmer {
            position: fixed;
            inset: 0;
            z-index: var(--z-dim);
            background: rgba(0, 0, 2, .94);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .45s ease, visibility .45s ease;
        }

        body.dark .dimmer {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            cursor: pointer;
        }

        body.dark .veil,
        body.dark .glyph {
            opacity: 0;
        }

        .topwrap {
            flex: none;
            z-index: var(--z-top);
            padding: clamp(.5rem, 1.2vw, .8rem) var(--pad) 0;
            transition: opacity .45s ease;
        }

        body.dark .topwrap {
            opacity: .05;
            pointer-events: none;
        }

        .topbar {
            width: var(--content);
            margin-inline: auto;
            display: flex;
            align-items: center;
            gap: .6rem;
            height: 54px;
            padding-inline: var(--bar-pad);
            border-radius: 16px;
            border: 1px solid rgba(93, 157, 255, .2);
            background: rgba(4, 4, 11, .86);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            box-shadow:
                0 10px 32px rgba(0, 0, 3, .7),
                inset 0 1px rgba(245, 247, 255, .06);
        }

        .mark {
            width: 25px;
            height: 25px;
            flex: none;
            border-radius: 7px;
            outline: 1px solid rgba(93, 157, 255, .32);
            outline-offset: 1px;
        }

        .wordmark {
            font-family: var(--display);
            font-weight: 700;
            font-size: .98rem;
            letter-spacing: .07em;
        }

        .wordmark a {
            color: var(--text);
            text-decoration: none;
        }

        .now {
            margin-left: auto;
            font-family: var(--mono);
            font-size: .72rem;
            letter-spacing: .05em;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 46%;
        }

        .page {
            position: relative;
            z-index: var(--z-page);
            flex: none;
            width: 100%;
            padding: 14px var(--pad) clamp(.7rem, 1.6vw, 1.1rem);
        }

        body.dark .page {
            pointer-events: none;
        }

        .stage {
            display: flex;
            justify-content: center;
        }

        .frame {
            position: relative;
            width: var(--content);
            aspect-ratio: 16 / 9;
        }

        body.dark .frame {
            pointer-events: auto;
        }

        .frame::before {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: calc(var(--r-frame) + 4px);
            background: conic-gradient(from var(--ang),
                    #3D87FF, #22D3EE, #7C5CFF, #F5F7FF, #3D87FF);
            filter: blur(22px);
            opacity: 0;
            transition: opacity .4s ease;
            pointer-events: none;
        }

        .frame:hover::before,
        .frame:focus-within::before,
        body.dark .frame::before {
            opacity: .6;
            animation: hue 7s linear infinite;
        }

        @keyframes hue {
            to { --ang: 360deg; }
        }

        .shell {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            border-radius: var(--r-frame);
            overflow: hidden;
            background: #000105 var(--art, none) center / cover no-repeat;
            box-shadow:
                0 22px 70px rgba(0, 0, 3, .82),
                0 0 0 1px rgba(42, 95, 208, .3);
        }

        .frame.stalled .shell {
            filter: saturate(.35) brightness(.55);
        }

        .subs {
            position: absolute;
            left: 0;
            right: 0;
            bottom: var(--sub-pos, 8%);
            display: none;
            justify-content: center;
            padding: 0 6%;
            pointer-events: none;
            z-index: 4;
        }

        .subs.on {
            display: flex;
        }

        .subs span {
            font-weight: 600;
            font-size: var(--sub-size, 1.4rem);
            line-height: 1.35;
            letter-spacing: .01em;
            color: #fff;
            text-align: center;
            background: rgba(0, 0, 0, .62);
            padding: .16em .5em;
            border-radius: .3em;
            text-shadow: 0 2px 6px rgba(0, 0, 0, .9);
            white-space: pre-wrap;
        }

        .nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: clamp(52px, 5vw, 88px);
            height: 46%;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 1;
            opacity: .72;
            text-decoration: none;
            box-shadow: 0 18px 44px rgba(0, 0, 3, .8);
            transition: opacity .28s ease, transform .28s cubic-bezier(.2, .8, .3, 1);
        }

        .nav.on {
            display: flex;
        }

        .nav.prev {
            right: calc(100% - 22px);
            border-radius: var(--r-frame) 0 0 var(--r-frame);
        }

        .nav.next {
            left: calc(100% - 22px);
            border-radius: 0 var(--r-frame) var(--r-frame) 0;
        }

        .nav:hover,
        .nav:focus-visible {
            opacity: 1;
        }

        .nav.prev:hover,
        .nav.prev:focus-visible {
            transform: translateY(-50%) translateX(-9px);
        }

        .nav.next:hover,
        .nav.next:focus-visible {
            transform: translateY(-50%) translateX(9px);
        }

        .navart {
            position: absolute;
            inset: -16%;
            background-color: var(--surface-2);
            background-size: cover;
            background-position: center;
            filter: blur(10px) saturate(125%) brightness(.62);
        }

        .nav svg {
            position: relative;
            width: 26px;
            height: 26px;
            fill: var(--text);
            opacity: 0;
            transform: scale(.8);
            filter: drop-shadow(0 3px 10px rgba(0, 0, 3, .95));
            transition: opacity .2s ease, transform .2s cubic-bezier(.2, .8, .3, 1);
        }

        .nav:hover svg,
        .nav:focus-visible svg {
            opacity: 1;
            transform: scale(1);
        }

        body.dark .nav {
            display: none;
        }

        @media (max-width: 1180px) {
            .nav {
                z-index: 6;
                opacity: 0;
                height: 40%;
                width: 46px;
            }

            .nav.prev {
                right: auto;
                left: 10px;
                border-radius: 12px;
            }

            .nav.next {
                left: auto;
                right: 10px;
                border-radius: 12px;
            }

            .nav.prev:hover,
            .nav.next:hover {
                transform: translateY(-50%);
            }

            .frame:hover .nav.on,
            .nav.on:focus-visible {
                opacity: 1;
            }

            .nav svg {
                opacity: 1;
                transform: scale(1);
            }
        }

        .stall {
            position: absolute;
            inset: 0;
            z-index: 4;
            display: none;
            place-items: center;
            padding: 1rem;
            background: rgba(0, 0, 3, .72);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }

        .frame.stalled .stall {
            display: grid;
        }

        .stall-box {
            max-width: 26rem;
            text-align: center;
            padding: .9rem 1.1rem;
            border-radius: var(--r);
            border: 1px solid rgba(93, 157, 255, .3);
            background: rgba(4, 4, 11, .92);
            font-size: .84rem;
            line-height: 1.45;
        }

        .stall-box b {
            display: block;
            margin-bottom: .25rem;
            font-family: var(--display);
            font-weight: 600;
            letter-spacing: .03em;
        }

        .fill {
            position: absolute;
            inset: 0;
        }

        video-player,
        video-minimal-skin {
            display: block;
            width: 100%;
            height: 100%;
        }

        video-player {
            position: relative;
        }

        .shell video {
            display: block;
            width: 100%;
            height: 100%;
            background: #000105;
        }

        video-player {
            --media-accent-color: #3D87FF;
            --media-accent-text-color: #000003;
            --media-border-radius: 8px;
            --media-scale-unit: 15px;
            --media-object-fit: contain;
        }

        .loading {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: grid;
            place-items: center;
            background: linear-gradient(rgba(0, 0, 3, .96), rgba(0, 0, 3, .99));
            transition: opacity .25s ease, visibility .25s ease;
        }

        .loading.gone {
            opacity: 0;
            visibility: hidden;
        }

        .load-copy {
            text-align: center;
            max-width: 20rem;
            padding: 0 1rem;
        }

        .load-copy b {
            display: block;
            font-family: var(--display);
            font-weight: 600;
            font-size: .95rem;
            letter-spacing: .04em;
        }

        .load-copy span {
            display: block;
            margin-top: .25rem;
            font-size: .8rem;
            color: var(--muted);
        }

        .bar {
            height: 2px;
            width: 8rem;
            margin: .8rem auto 0;
            border-radius: 2px;
            background: rgba(93, 157, 255, .16);
            overflow: hidden;
        }

        .bar::after {
            content: "";
            display: block;
            width: 40%;
            height: 100%;
            border-radius: 2px;
            background: var(--accent);
            animation: sweep 1.4s ease-in-out infinite;
        }

        @keyframes sweep {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }

        .below {
            flex: none;
            width: var(--content);
            margin-inline: auto;
            padding-top: 14px;
            transition: opacity .45s ease;
        }

        body.dark .below {
            opacity: .05;
            pointer-events: none;
        }

        .head {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px .8rem;
        }

        .txt {
            min-width: 0;
            flex: 1 1 auto;
        }

        h1 {
            font-size: clamp(.95rem, 1.4vw, 1.2rem);
            font-weight: 700;
            letter-spacing: .005em;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta {
            display: flex;
            align-items: center;
            gap: .3rem .65rem;
            margin-top: 6px;
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
            font-size: .72rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta i {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--line-2);
            flex: none;
        }

        .acts {
            display: flex;
            flex-wrap: wrap;
            gap: .35rem;
            flex: 0 0 auto;
            margin-left: auto;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .45rem;
            height: 36px;
            padding: 0 .8rem;
            border-radius: var(--r);
            border: 1px solid var(--line);
            background: var(--surface-2);
            color: var(--text);
            font: inherit;
            font-size: .8rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
            transition: border-color .16s ease, background .16s ease, transform .12s ease;
        }

        .btn:hover {
            border-color: var(--line-2);
            background: var(--accent-soft);
        }

        .btn:active {
            transform: scale(.97);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
            flex: none;
        }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000003;
            font-weight: 600;
        }

        .btn.primary:hover {
            background: var(--accent-2);
            border-color: var(--accent-2);
        }

        .btn.icon {
            width: 36px;
            padding: 0;
        }

        .btn.on {
            border-color: var(--accent);
            color: var(--accent-2);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: .4rem;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid var(--line);
        }

        .spacer {
            flex: 1 1 auto;
        }

        .dd {
            position: relative;
            display: none;
            min-width: 0;
        }

        .dd.show {
            display: block;
        }

        .dd-btn {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            height: 36px;
            max-width: 100%;
            padding: 0 .65rem;
            border-radius: var(--r);
            border: 1px solid var(--line);
            background: var(--surface-2);
            color: var(--text);
            font: inherit;
            font-size: .78rem;
            font-weight: 500;
            cursor: pointer;
            transition: border-color .16s ease, background .16s ease;
        }

        .dd-btn:hover {
            border-color: var(--line-2);
            background: var(--accent-soft);
        }

        .dd-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .dd-btn em {
            font-family: var(--mono);
            font-style: normal;
            font-size: .62rem;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--muted);
            flex: none;
        }

        .dd-btn b {
            font-weight: 500;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .dd-btn svg {
            width: 11px;
            height: 11px;
            fill: var(--muted);
            flex: none;
            transition: transform .18s ease;
        }

        .dd.open .dd-btn svg {
            transform: rotate(180deg);
        }

        .dd-panel {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 0;
            min-width: 100%;
            width: max-content;
            max-width: min(21rem, 86vw);
            max-height: min(17rem, 46dvh);
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-color: rgba(42, 95, 208, .5) transparent;
            padding: .3rem;
            border-radius: var(--r);
            border: 1px solid rgba(93, 157, 255, .28);
            background: rgba(4, 4, 11, .98);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 18px 48px rgba(0, 0, 3, .85);
            display: none;
            z-index: var(--z-pop);
        }

        .dd.down .dd-panel {
            bottom: auto;
            top: calc(100% + 6px);
        }

        .dd.right .dd-panel {
            left: auto;
            right: 0;
        }

        .dd.open .dd-panel {
            display: block;
        }

        .dd-group {
            font-family: var(--mono);
            font-size: .58rem;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--muted);
            padding: .45rem .5rem .25rem;
        }

        .dd-item {
            display: flex;
            align-items: center;
            gap: .5rem;
            width: 100%;
            padding: .42rem .5rem;
            border: 0;
            border-radius: 8px;
            background: none;
            color: var(--text);
            font: inherit;
            font-size: .78rem;
            text-align: left;
            cursor: pointer;
            transition: background .12s ease;
        }

        .dd-item:hover,
        .dd-item:focus-visible {
            background: var(--accent-soft);
            outline: none;
        }

        .dd-item[aria-selected="true"] {
            color: var(--accent-2);
        }

        .dd-item[aria-selected="true"]::after {
            content: "";
            width: 6px;
            height: 6px;
            margin-left: auto;
            border-radius: 50%;
            background: var(--accent);
            flex: none;
        }

        libmedia-video {
            display: block;
            position: relative;
            width: 100%;
            height: 100%;
            background: #000105;
        }

        .resume {
            display: none;
            align-items: center;
            gap: .45rem;
            margin-top: .5rem;
            font-size: .8rem;
            color: var(--muted);
        }

        .resume.show {
            display: flex;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 1.2rem;
            transform: translate(-50%, 1.5rem);
            background: rgba(4, 4, 11, .97);
            border: 1px solid var(--line-2);
            border-radius: 999px;
            padding: .45rem 1rem;
            font-size: .8rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
            z-index: var(--z-toast);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .err {
            display: grid;
            place-content: center;
            text-align: center;
            min-height: 40dvh;
            gap: .5rem;
        }

        .err h2 {
            font-family: var(--display);
            font-weight: 700;
            letter-spacing: .02em;
            margin: 0;
        }

        .err p {
            color: var(--muted);
            margin: 0;
        }

        .err a {
            justify-self: center;
            margin-top: .6rem;
        }

        @media (max-width: 900px) {
            .glyph {
                font-size: clamp(9rem, 30vmin, 16rem);
            }

            .glyph--w {
                top: .6rem;
                left: clamp(.4rem, 5vw, 2rem);
                transform: none;
            }

            .glyph--x {
                top: auto;
                bottom: 1.6rem;
                right: clamp(.5rem, 3.5vw, 1.8rem);
                transform: none;
            }
        }

        @media (max-width: 900px) {
            .acts {
                margin-left: 0;
                width: 100%;
            }

            .acts .btn:first-child {
                flex: 1 1 auto;
            }
        }

        @media (max-width: 640px) {
            :root {
                --pad: 16px;
                --bar-pad: 14px;
                --chrome: 18.5rem;
            }

            body {
                font-size: 15px;
            }

            .topbar {
                height: 48px;
                border-radius: 14px;
            }

            .wordmark {
                font-size: .9rem;
            }

            .now {
                display: none;
            }

            .shell {
                border-radius: 14px;
            }

            video-player {
                --media-scale-unit: 13px;
            }

            h1 {
                font-size: .92rem;
            }

            .meta {
                font-size: .68rem;
            }

            .btn {
                height: 34px;
                padding: 0 .6rem;
                font-size: .76rem;
            }

            .btn.icon {
                width: 34px;
            }

            .dd-btn {
                height: 34px;
                font-size: .74rem;
                padding: 0 .5rem;
            }

            .dd-btn em {
                display: none;
            }

            .controls {
                gap: .3rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation: none !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

    <div class="toast" id="toast"></div>

    <script type="module"
        src="https://cdn.jsdelivr.net/npm/@videojs/html@10.0.0-beta.31/cdn/video-minimal.js"></script>
    <script type="module">
        import { CustomVideoElement } from
            "https://cdn.jsdelivr.net/npm/custom-media-element@1.4.6/+esm";

        const AVPLAYER_SRC =
            "https://cdn.jsdelivr.net/npm/@libmedia/avplayer@1.3.1/dist/umd/avplayer.js";

        let loading = null;

        function loadAVPlayer() {
            if (window.AVPlayer) return Promise.resolve(window.AVPlayer);
            if (loading) return loading;
            loading = new Promise((ok, no) => {
                const sc = document.createElement("script");
                sc.src = AVPLAYER_SRC;
                sc.crossOrigin = "anonymous";
                sc.onload = () => window.AVPlayer
                    ? ok(window.AVPlayer)
                    : no(new Error("AVPlayer global missing"));
                sc.onerror = () => no(new Error("decoder failed to load"));
                document.head.appendChild(sc);
            });
            return loading;
        }

        const MEDIA_CONTEXT = Symbol.for("@videojs/media");

        class ContextEvent extends Event {
            constructor(context, contextTarget, callback, subscribe) {
                super("context-request", { bubbles: true, composed: true });
                this.context = context;
                this.contextTarget = contextTarget;
                this.callback = callback;
                this.subscribe = subscribe;
            }
        }

        class LibmediaVideoElement extends CustomVideoElement {
            static tagName = "libmedia-video";

            static preload() {
                return loadAVPlayer().catch(() => { });
            }

            static observedAttributes = [
                ...(CustomVideoElement.observedAttributes || []), "src"
            ];

            #player = null;
            #host = null;
            #time = 0;
            #dur = 0;
            #paused = true;
            #ended = false;
            #ready = 0;
            #vol = 1;
            #muted = false;
            #rate = 1;
            #streams = [];
            #starting = false;
            #mounted = false;
            #loaded = false;
            #started = false;
            #primed = false;
            #pendingSeek = null;
            #subsOn = false;
            #queue = Promise.resolve();
            #setMedia = null;
            #unsub = null;

            constructor() {
                super();
                this.#host = document.createElement("div");
                Object.assign(this.#host.style, {
                    position: "absolute", inset: "0", zIndex: "1"
                });
            }

            #mount() {
                if (this.#mounted) return;
                const root = this.shadowRoot;
                if (!root) return;
                this.#mounted = true;
                const css = document.createElement("style");
                css.textContent = ":host{display:block;position:relative;"
                    + "width:100%;height:100%}"
                    + "canvas,video{width:100%!important;height:100%!important;"
                    + "object-fit:contain;background:#000105}";
                root.appendChild(css);
                root.appendChild(this.#host);
                const native = this.nativeEl;
                if (native) native.style.visibility = "hidden";
            }

            connectedCallback() {
                try { super.connectedCallback(); } catch (e) { }
                this.#mount();
                this.#claimPlayer();
            }

            #claimPlayer() {
                const self = this;
                this.dispatchEvent(new ContextEvent(
                    MEDIA_CONTEXT,
                    this,
                    function (value, unsubscribe) {
                        if (unsubscribe) self.#unsub = unsubscribe;
                        self.#setMedia = (value && value.setMedia) || null;
                        if (self.isConnected && self.#setMedia) {
                            self.#setMedia(self);
                        }
                    },
                    true
                ));
            }

            get streams() { return this.#streams; }
            get player() { return this.#player; }

            attributeChangedCallback(name, was, now) {
                if (name === "src") {
                    if (now && now !== was) this.#boot(now);
                    return;
                }
                try { super.attributeChangedCallback(name, was, now); } catch (e) { }
            }

            get src() { return this.getAttribute("src") || ""; }
            set src(v) { this.setAttribute("src", v); }

            #emit(type) { this.dispatchEvent(new Event(type)); }

            #seconds(pts) {
                const v = Number(pts);
                if (!isFinite(v) || v < 0) return 0;
                return v / 1000;
            }

            #durationFrom(streams) {
                let best = 0;
                for (const t of streams) {
                    if (!t || !t.duration) continue;
                    const tb = t.timeBase;
                    const d = Number(t.duration);
                    if (!isFinite(d) || d <= 0) continue;
                    const secs = tb && Number(tb.den) > 0
                        ? d * (Number(tb.num) || 1) / Number(tb.den)
                        : d / 1000;
                    if (secs > best) best = secs;
                }
                return best;
            }

            async #boot(url) {
                if (this.#starting) return;
                this.#mount();
                this.#starting = true;
                this.#loaded = false;
                this.#started = false;
                this.#primed = false;
                this.#pendingSeek = null;
                this.#emit("loadstart");
                try {
                    const AVPlayer = await loadAVPlayer();
                    if (this.#player) {
                        try { await this.#player.destroy(); } catch (e) { }
                        this.#player = null;
                    }
                    const p = new AVPlayer({
                        container: this.#host,
                        isLive: false
                    });
                    this.#player = p;

                    p.on("time", (pts) => {
                        this.#time = this.#seconds(pts);
                        this.#emit("timeupdate");
                    });
                    p.on("played", () => {
                        this.#paused = false; this.#ended = false; this.#emit("play");
                    });
                    p.on("playing", () => {
                        this.#paused = false; this.#emit("playing");
                    });
                    p.on("paused", () => { this.#paused = true; this.#emit("pause"); });
                    p.on("ended", () => {
                        this.#paused = true; this.#ended = true; this.#emit("ended");
                    });
                    p.on("seeking", () => this.#emit("seeking"));
                    p.on("seeked", () => this.#emit("seeked"));
                    p.on("error", (e) => {
                        console.error("[wzx] libmedia-video", e);
                        this.#emit("error");
                    });

                    await p.load(url);
                    this.#loaded = true;
                    this.#streams = p.getStreams ? p.getStreams() : [];
                    this.#dur = this.#durationFrom(this.#streams);
                    this.#ready = 4;
                    this.#emit("durationchange");
                    this.#emit("loadedmetadata");
                    this.#emit("canplay");
                    this.dispatchEvent(new CustomEvent("libmediastreams", {
                        detail: this.#streams, bubbles: true
                    }));
                } catch (e) {
                    console.error("[wzx] libmedia-video boot", e);
                    this.#emit("error");
                } finally {
                    this.#starting = false;
                }
            }

            prime() {
                if (this.#primed) return Promise.resolve(true);
                if (!this.#loaded) return Promise.resolve(false);
                this.#primed = true;
                const self = this;
                return new Promise(function (done) {
                    let settled = false;
                    const stop = function (ok) {
                        if (settled) return;
                        settled = true;
                        clearTimeout(timer);
                        self.removeEventListener("timeupdate", tick);
                        self.removeEventListener("error", bad);
                        try { self.pause(); } catch (e) { }
                        done(ok);
                    };
                    const tick = function () { stop(true); };
                    const bad = function () { stop(false); };
                    const timer = setTimeout(function () { stop(false); }, 20000);
                    self.addEventListener("timeupdate", tick);
                    self.addEventListener("error", bad);
                    try {
                        self.muted = true;
                        const p = self.play();
                        if (p && p.catch) p.catch(function () { stop(false); });
                    } catch (e) { stop(false); }
                });
            }

            #run(fn) {
                const step = () => fn();
                const next = this.#queue.then(step, step);
                this.#queue = next.then(() => { }, () => { });
                return next;
            }

            #playable(st) { return st === 4 || st === 7 || st === 8; }

            #active(st) { return st === 5 || st === 6; }

            #transient(st) { return st === 2 || st === 3 || st === 10; }

            async #settle() {
                const p = this.#player;
                if (!p) return;
                for (let i = 0; i < 80 && this.#transient(p.status); i++) {
                    await new Promise((r) => setTimeout(r, 25));
                }
            }

            #applySubs() {
                const p = this.#player;
                if (!p || typeof p.setSubtitleEnable !== "function") return;
                try { p.setSubtitleEnable(this.#subsOn); } catch (e) { }
            }

            async #doPlay() {
                const p = this.#player;
                if (!p || !this.#loaded) return;
                await this.#settle();
                if (this.#active(p.status)) {
                    this.#started = true;
                } else if (this.#playable(p.status)) {
                    await p.play();
                    this.#started = true;
                } else {
                    this.#paused = true;
                    this.#emit("pause");
                    return;
                }
                this.#applySubs();
                if (this.#pendingSeek !== null) {
                    const at = this.#pendingSeek;
                    this.#pendingSeek = null;
                    await this.#doSeek(at);
                }
            }

            async #doPause() {
                const p = this.#player;
                if (!p || !this.#started) return;
                await this.#settle();
                if (this.#active(p.status)) p.pause();
            }

            async #doSeek(secs) {
                const p = this.#player;
                if (!p) return;
                const ms = Math.max(0, Math.round(secs * 1000));
                this.#emit("seeking");
                try {
                    await p.seek(BigInt(ms));
                } catch (e) {
                    try { await p.seek(ms); } catch (e2) { }
                }
                this.#applySubs();
                this.#emit("seeked");
                this.#emit("timeupdate");
            }

            async #doSelect(kind, id) {
                const p = this.#player;
                if (!p) return;
                await this.#settle();
                if (kind === "audio") {
                    const at = this.#time;
                    await p.selectAudio(id);
                    await this.#settle();
                    let now = at;
                    try { now = Number(p.currentTime) / 1000; } catch (e) { }
                    if (this.#started && Math.abs(now - at) > 2) {
                        await this.#doSeek(at);
                    }
                } else if (Number(id) < 0) {
                    this.#subsOn = false;
                } else {
                    this.#subsOn = true;
                    const cur = p.selectedSubtitleStream;
                    if (!cur || cur.id !== Number(id)) {
                        try { await p.selectSubtitle(id); } catch (e) { }
                    }
                }
                await this.#settle();
                this.#applySubs();
                if (kind !== "audio" && this.#subsOn && this.#started) {
                    await this.#doSeek(this.#time);
                }
            }

            play() {
                this.#paused = false;
                this.#emit("play");
                return this.#run(() => this.#doPlay());
            }

            pause() {
                this.#paused = true;
                this.#emit("pause");
                this.#run(() => this.#doPause());
            }

            get paused() { return this.#paused; }
            get ended() { return this.#ended; }
            get seeking() { return false; }
            get readyState() { return this.#ready; }
            get duration() { return this.#dur || NaN; }
            #ranges() {
                const self = this;
                return {
                    get length() { return self.#dur > 0 ? 1 : 0; },
                    start: function () { return 0; },
                    end: function () { return self.#dur; }
                };
            }

            get buffered() { return this.#ranges(); }
            get seekable() { return this.#ranges(); }
            get videoWidth() { return (this.#host && this.#host.clientWidth) || 0; }
            get videoHeight() { return (this.#host && this.#host.clientHeight) || 0; }

            get currentTime() { return this.#time; }
            set currentTime(v) {
                const t = Number(v);
                if (!isFinite(t) || t < 0) return;
                this.#time = t;
                if (!this.#player || !this.#started) {
                    this.#pendingSeek = t;
                    this.#emit("timeupdate");
                    return;
                }
                this.#run(() => this.#doSeek(t));
            }

            get volume() { return this.#vol; }
            set volume(v) {
                this.#vol = Math.max(0, Math.min(1, Number(v)));
                try { this.#player && this.#player.setVolume(this.#muted ? 0 : this.#vol); }
                catch (e) { }
                this.#emit("volumechange");
            }

            get muted() { return this.#muted; }
            set muted(v) {
                this.#muted = !!v;
                try { this.#player && this.#player.setVolume(this.#muted ? 0 : this.#vol); }
                catch (e) { }
                this.#emit("volumechange");
            }

            get playbackRate() { return this.#rate; }
            set playbackRate(v) {
                this.#rate = Number(v) || 1;
                try { this.#player && this.#player.setPlaybackRate(this.#rate); }
                catch (e) { }
                this.dispatchEvent(new Event("ratechange"));
            }

            selectAudio(id) {
                return this.#run(() => this.#doSelect("audio", id));
            }

            selectSubtitle(id) {
                return this.#run(() => this.#doSelect("subtitle", id));
            }

            disconnectedCallback() {
                try { this.#setMedia && this.#setMedia(null); } catch (e) { }
                try { this.#unsub && this.#unsub(); } catch (e) { }
                this.#unsub = null;
                this.#setMedia = null;
                try { this.#player && this.#player.destroy(); } catch (e) { }
                this.#player = null;
                try { super.disconnectedCallback(); } catch (e) { }
            }
        }

        if (!customElements.get("libmedia-video")) {
            customElements.define("libmedia-video", LibmediaVideoElement);
        }

        const MERGE_NOISE = [
            "durationchange", "emptied", "abort", "loadstart",
            "suspend", "canplaythrough"
        ];
        const PRELOAD_LEAD = 15;
        const MAX_RELOADS = 2;
        const SWITCH_LEAD = 0.35;
        const PRELOAD_COOLDOWN = 8000;
        const RETIRE_DELAY = 80;

        class MergedVideoElement extends CustomVideoElement {
            static tagName = "merged-video";

            static observedAttributes = [
                ...(CustomVideoElement.observedAttributes || [])
            ];

            #parts = [];
            #i = 0;
            #total = 0;
            #kind = "native";
            #live = null;
            #idle = null;
            #idleAt = -1;
            #wantPlay = false;
            #announced = false;
            #mounted = false;
            #vol = 1;
            #muted = false;
            #rate = 1;
            #streams = [];
            #audioNth = null;
            #retried = {};
            #reloads = {};
            #busy = false;
            #queued = null;
            #warmed = {};
            #cold = {};
            #retiring = new Set();
            #fellBack = false;
            #setMedia = null;
            #unsub = null;

            #mount() {
                if (this.#mounted) return;
                const root = this.shadowRoot;
                if (!root) return;
                this.#mounted = true;
                const css = document.createElement("style");
                css.textContent = ":host{display:block;position:relative;"
                    + "width:100%;height:100%}"
                    + "video,libmedia-video{position:absolute;inset:0;"
                    + "width:100%!important;height:100%!important;"
                    + "object-fit:contain;background:#000105}"
                    + ".mv-idle{visibility:hidden;pointer-events:none;z-index:0}"
                    + ".mv-live{visibility:visible;z-index:1}";
                root.appendChild(css);
                const base = root.querySelector("video");

            function stamp(txt) {
                var bits = txt.trim().split(":");
                var out = 0;

                }

            function parseVtt(text) {
                var lines = text.replace(/\r/g, "").split("\n");
                var out = [];
                var i = 0;
                while (i < lines.length) {
                    var line = lines[i++];
                    if (line.indexOf("-->") === -1) continue;
                    var half = line.split("-->");
                    var from = stamp(half[0]);
                    var to = stamp(half[1].trim().split(/\s+/)[0]);
                    var buf = [];
                    while (i < lines.length && lines[i].trim() !== "") {
                        buf.push(lines[i++]);
                    }
                    if (to > from) {
                        out.push({
                            s: from, e: to,
                            t: buf.join("\n").replace(/<[^>]*>/g, "")
                        });
                    }
                }
                out.sort(function (a, b) { return a.s - b.s; });
                return out;
            }

            function subUrl(token, idx) {

                    .then(function (r) {

                        return r.text();

                    .then(parseVtt);

            function ensurePartSubs(index) {
                if (!MERGE || subTrack === "-1") return;
                var part = (vid.parts || [])[index];
                if (!part) return;
                var key = subTrack + ":" + index;
                if (subDone[key]) return;
                subDone[key] = true;
                var track = subTrack;
                fetchSubs(part.token, track).then(function (found) {
                    if (track !== subTrack || !found.length) return;
                    var shift = part.start - (part.trim || 0);
                    for (var i = 0; i < found.length; i++) {
                        cues.push({
                            s: found[i].s + shift,
                            e: found[i].e + shift,
                            t: found[i].t
                        });
                    }
                    cues.sort(function (a, b) { return a.s - b.s; });
                    cueStore[track] = cues;
                    cueAt = -2;
                }).catch(function (e) {
                    subDone[key] = false;
                    lmErr(e);
                });
            }

            function paintCue() {
                if (!vid) return;
                if (MERGE) {
                    var now = vid.partIndex || 0;
                    if (now !== subPart) {
                        subPart = now;
                        ensurePartSubs(now);
                    }
                }
                var t = vid.currentTime || 0;
                var lo = 0, hi = cues.length - 1, hit = -1;
                while (lo <= hi) {
                    var mid = (lo + hi) >> 1;
                    if (t < cues[mid].s) hi = mid - 1;
                    else if (t > cues[mid].e) lo = mid + 1;
                    else { hit = mid; break; }
                }
                if (hit === cueAt) return;
                cueAt = hit;
                if (hit === -1) {
                    subsBox.classList.remove("on");
                    subsLine.textContent = "";
                } else {
                    subsLine.textContent = cues[hit].t;
                    subsBox.classList.add("on");
                }
            }

            function setSubtitleTrack(value, label) {

                if (MERGE) {

                    applySubStyle();
                    if (!held) {
                        toast("Extracting subtitles, this can take a moment");
                    }
                    ensurePartSubs(vid.partIndex || 0);
                    subPart = vid.partIndex || 0;
                    subTimer = setInterval(paintCue, 200);
                    paintCue();
                    if (held) toast((label || "Subtitles") + " on");
                    return;
                }
                if (held) {
                    cues = held;
                    applySubStyle();
                    subTimer = setInterval(paintCue, 200);
                    paintCue();
                    toast((label || "Subtitles") + " on");
                    return;

                }
                if (list.total > 1) {
                    addMeta(list.index + " of " + list.total);
                }
            }

            function bootMerged() {
                return customElements.whenDefined("merged-video").then(function () {
                    var skin = vid.parentNode;
                    var node = document.createElement("merged-video");
                    node.setAttribute("playsinline", "");
                    node.addEventListener("libmediastreams", function (ev) {
                        lmStreams = ev.detail || [];
                        lmRebuildMenus();
                        el("loading").classList.add("gone");
                        clearStall();
                    });
                    node.addEventListener("mergednotice", function (ev) {
                        toast(String(ev.detail || ""));
                    });
                    node.addEventListener("mergedpreload", function (ev) {
                        ensurePartSubs(Number(ev.detail) || 0);
                    });
                    node.addEventListener("error", function () {
                        el("loading").classList.add("gone");
                        stall("Playback stopped",
                            "A part could not be loaded after several tries. "
                            + "Reload the page, open the parts page below, or "
                            + "pick a player.");
                    });

                    try { vid.pause(); } catch (e) { }
                    vid.removeAttribute("src");
                    try { vid.load(); } catch (e) { }
                    skin.replaceChild(node, vid);
                    vid = node;
                    bindMedia(node, false);

                    var kind = nativeHopeless() ? "avp" : "native";
                    if (kind === "avp") {
                        lmEl = node;
                        warmDecoder();
                        el("loadingText").textContent = "Starting the decoder";
                    }
                    return node.setParts(MERGE.parts, 0, kind);
                }).catch(function (e) {
                    lmErr(e);
                    stall("Cannot play these parts",
                        "The merged player could not start. Open the parts "
                        + "page below, or pick a player.");
                    return false;
                });
            }

            function start(info) {
                var set = info.merge;
                if (set && set.parts && set.parts.length > 1) {
                    MERGE = set;
                    TRACK_TOKEN = set.parts[0].token;
                    APP_SRC = location.origin + "/m3u/"
                        + encodeURIComponent(TOKEN);
                    DIRECT = location.origin + "/playlist/"
                        + encodeURIComponent(TOKEN);
                }
                FILE = info.name || "Untitled";
                MIME = info.mime || "";
                document.title = FILE + " · WZML-X";
                el("title").textContent = FILE;
                el("title").title = FILE;
                el("now").textContent = FILE;
                el("dl").href = DIRECT;
                if (MERGE) {
                    el("dl").removeAttribute("download");
                    el("dl").title = "Open the parts page";
                    var label = el("dl").lastChild;
                    if (label && label.nodeType === 3) {
                        label.nodeValue = label.nodeValue.replace(
                            "Download", "All Parts");
                    }
                } else {
                    el("dl").setAttribute("download", FILE);
                }
                buildApps();
                applySubStyle();
                showArt();
                loadTracks();
                addMeta(bytes(info.size));
                if (MIME) addMeta(MIME);
                if (MERGE) addMeta(MERGE.count + " parts");
                wireNav(info.playlist);

                if (MERGE) {
                    if (MERGE.partial) {
                        toast("Some parts are missing, playing the rest");
                    }
                    bootMerged();
                } else {
                    bindMedia(vid, true);
                    vid.addEventListener("error", function () {
                        el("loading").classList.add("gone");
                        var e = vid.error;
                        if (e && e.code === 4) {
                            stall("Switching decoder",
                                "This browser cannot decode the file natively. Loading "
                                + "the advanced decoder.");
                            startLibmedia(Math.max(0, vid.currentTime || 0));
                        } else {
                            stall("Playback stopped",
                                "The connection dropped or the link expired. Reload " +
                                "the page, or pick a player below.");
                        }
                    });

                    if (nativeHopeless()) {
                        lmLog("native cannot open " + MIME + ", decoding directly");
                        warmDecoder();
                        el("loadingText").textContent = "Starting the decoder";
                        startLibmedia(0);
                    } else {
                        vid.setAttribute("type", MIME);
                        vid.src = STREAM;
                    }
                }

                setTimeout(function () {
                    if (!el("loading").classList.contains("gone")) {
                        el("loadingText").textContent =
                            "Still buffering, large files take a moment";
                    }
                }, 6000);
            }

            (function () {
                if (!window.matchMedia || !matchMedia("(hover: hover)").matches) return;
                var root = document.documentElement;
                var px = 0, py = 0, queued = false;
                function paint() {
                    queued = false;
                    root.style.setProperty("--mx", px + "px");
                    root.style.setProperty("--my", py + "px");
                }
                window.addEventListener("pointermove", function (e) {
                    px = e.clientX;
                    py = e.clientY;
                    if (!document.body.classList.contains("tracking")) {
                        document.body.classList.add("tracking");
                    }
                    if (!queued) {
                        queued = true;
                        requestAnimationFrame(paint);
                    }
                }, { passive: true });
                window.addEventListener("pointerleave", function () {
                    document.body.classList.remove("tracking");
                });
            })();

            function setLights(on) {
                var b = el("lights");
                document.body.classList.toggle("dark", on);
                b.classList.toggle("on", on);
                b.setAttribute("aria-pressed", on ? "true" : "false");
                b.title = on ? "Turn the lights on" : "Turn the lights off";
                b.setAttribute("aria-label", b.title);
            }

            el("lights").onclick = function () {
                setLights(!document.body.classList.contains("dark"));
            };
            el("dimmer").addEventListener("click", function () { setLights(false); });
            el("dimmer").addEventListener("touchend", function (e) {
                e.preventDefault();
                setLights(false);
            });
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape" && document.body.classList.contains("dark")) {
                    setLights(false);
                }
            });

            window.addEventListener("unhandledrejection", function (e) {
                var r = e && e.reason;
                var msg = r && r.message ? r.message : String(r || "");
                if (!lmEl || !/division by zero/i.test(msg)) return;
                e.preventDefault();
                lmErr(r);
                toast("Playback hit a decoder fault, try reloading");
            });

            el("copy").onclick = function () {
                navigator.clipboard.writeText(location.href).then(
                    function () { toast("Page link copied"); },
                    function () { toast("Copy failed"); });
            };
            el("copyDl").onclick = function () {
                navigator.clipboard.writeText(DIRECT).then(
                    function () {
                        toast(MERGE ? "Parts page link copied"
                            : "Direct link copied");
                    },
                    function () { toast("Copy failed"); });
            };

            if (!TOKEN) {
                fatal("Nothing to play", "This link is missing its file reference.");
                return;
            }

            fetch("/api/stream/" + encodeURIComponent(TOKEN), { cache: "no-store" })
                .then(function (r) {
                    if (r.status === 404) throw new Error("gone");
                    if (!r.ok) throw new Error("bad");
                    return r.json();
                })
                .then(start)
                .catch(function (e) {
                    if (e && e.message === "gone") {
                        fatal("This file is no longer available",
                            "It was removed from the source chat, or the link is wrong.");
                    } else {
                        fatal("Could not load this file",
                            "The streaming service did not respond. Try again shortly.");
                    }
                });
        })();
    </script>
</body>

</html>
