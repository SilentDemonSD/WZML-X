<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#000003">
    <title>Stream · WZML-X</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22.5' fill='%23F5F7FF'/%3E%3Cpath d='M 19.4 42.6 C 20.0 55.4 22.4 66.4 29.8 68.3 C 37.0 70.1 43.2 61.0 45.2 48.8 C 47.5 61.0 53.4 66.6 61.0 68.3 C 68.6 70.0 75.6 55.5 80.6 35.3' fill='none' stroke='%233D87FF' stroke-width='11.1' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Tektur:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        @property --ang {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        :root {
            color-scheme: dark;
            --bg: #000003;
            --surface: #04040B;
            --surface-2: #07070F;
            --line: rgba(42, 95, 208, .28);
            --line-2: #2A5FD0;
            --text: #F5F7FF;
            --muted: #C3CBDF;
            --accent: #3D87FF;
            --accent-2: #5B9DFF;
            --accent-soft: #06153F;
            --r: 12px;
            --r-frame: 18px;
            --pad: clamp(.6rem, 2vw, 1.5rem);
            --bar-pad: 16px;
            --chrome: 16.5rem;
            --content: min(1240px,
                calc((100svh - var(--chrome)) * 16 / 9),
                calc(100vw - 2 * var(--pad)));
            --sans: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --display: 'Tektur', 'Montserrat', system-ui, sans-serif;
            --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace;
            --z-glyph: 0;
            --z-spot: 1;
            --z-dim: 2;
            --z-page: 3;
            --z-top: 30;
            --z-pop: 40;
            --z-toast: 70;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
        }

        body {
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            justify-content: safe center;
            overflow-x: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 16px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        ::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(42, 95, 208, .45);
            border-radius: 999px;
        }

        .veil {
            position: fixed;
            inset: 0;
            z-index: var(--z-glyph);
            pointer-events: none;
            opacity: .38;
            transition: opacity .45s ease;
            background:
                linear-gradient(rgba(42, 95, 208, .13) 1px, transparent 1px) 50% / 13px 13px,
                linear-gradient(90deg, rgba(42, 95, 208, .13) 1px, transparent 1px) 50% / 13px 13px,
                radial-gradient(circle at 50% 12%, rgba(61, 135, 255, .1), transparent 26%),
                radial-gradient(circle at 50% 94%, rgba(6, 21, 63, .55), transparent 44%);
        }

        .spot {
            position: fixed;
            inset: 0;
            z-index: var(--z-spot);
            pointer-events: none;
            opacity: 0;
            transition: opacity .35s ease;
            background:
                linear-gradient(rgba(245, 247, 255, .16) 1px, transparent 1px) 50% / 13px 13px,
                linear-gradient(90deg, rgba(245, 247, 255, .16) 1px, transparent 1px) 50% / 13px 13px;
            -webkit-mask-image: radial-gradient(circle 190px at var(--mx, -999px) var(--my, -999px),
                    rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, .45) 45%, transparent 72%);
            mask-image: radial-gradient(circle 190px at var(--mx, -999px) var(--my, -999px),
                    rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, .45) 45%, transparent 72%);
        }

        @media (hover: hover) and (pointer: fine) {
            body.tracking .spot {
                opacity: 1;
            }
        }

        body.dark .spot {
            opacity: 0;
        }

        .glyph {
            position: fixed;
            z-index: var(--z-glyph);
            font-family: var(--display);
            font-size: clamp(10rem, 22vw, 24rem);
            font-weight: 600;
            line-height: .8;
            letter-spacing: -.08em;
            color: #04081a;
            opacity: .72;
            filter: drop-shadow(0 0 42px rgba(0, 0, 3, .95));
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
            transition: opacity .45s ease;
            animation: fade 1.2s cubic-bezier(.16, 1, .3, 1) both;
        }

        .glyph::before {
            content: attr(data-letter);
            position: absolute;
            inset: 0;
            color: transparent;
            background:
                radial-gradient(circle at 40% 25%, rgba(93, 157, 255, .3), transparent 34%),
                radial-gradient(circle at 60% 75%, rgba(61, 135, 255, .11), transparent 36%),
                linear-gradient(rgba(245, 247, 255, .13), rgba(245, 247, 255, .03));
            -webkit-background-clip: text;
            background-clip: text;
            filter: blur(22px);
            opacity: .9;
            transform: scale(1.06);
        }

        .glyph::after {
            content: attr(data-letter);
            position: absolute;
            inset: 0;
            color: rgba(195, 203, 223, .1);
            text-shadow: 0 0 18px rgba(93, 157, 255, .1), 0 0 60px rgba(0, 0, 3, .95);
            transform: scale(1.01);
        }

        .glyph--w {
            top: 50%;
            left: clamp(.2rem, 1.2vw, 1.5rem);
            transform: translateY(-50%) scaleX(.92);
        }

        .glyph--x {
            top: 50%;
            right: clamp(.8rem, 2.5vw, 2.6rem);
            transform: translateY(-50%) scaleX(.92);
        }

        @keyframes fade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .dimmer {
            position: fixed;
            inset: 0;
            z-index: var(--z-dim);
            background: rgba(0, 0, 2, .94);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .45s ease, visibility .45s ease;
        }

        body.dark .dimmer {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            cursor: pointer;
        }

        body.dark .veil,
        body.dark .glyph {
            opacity: 0;
        }

        .topwrap {
            flex: none;
            z-index: var(--z-top);
            padding: clamp(.5rem, 1.2vw, .8rem) var(--pad) 0;
            transition: opacity .45s ease;
        }

        body.dark .topwrap {
            opacity: .05;
            pointer-events: none;
        }

        .topbar {
            width: var(--content);
            margin-inline: auto;
            display: flex;
            align-items: center;
            gap: .6rem;
            height: 54px;
            padding-inline: var(--bar-pad);
            border-radius: 16px;
            border: 1px solid rgba(93, 157, 255, .2);
            background: rgba(4, 4, 11, .86);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            box-shadow:
                0 10px 32px rgba(0, 0, 3, .7),
                inset 0 1px rgba(245, 247, 255, .06);
        }

        .mark {
            width: 25px;
            height: 25px;
            flex: none;
            border-radius: 7px;
            outline: 1px solid rgba(93, 157, 255, .32);
            outline-offset: 1px;
        }

        .wordmark {
            font-family: var(--display);
            font-weight: 700;
            font-size: .98rem;
            letter-spacing: .07em;
        }

        .wordmark a {
            color: var(--text);
            text-decoration: none;
        }

        .now {
            margin-left: auto;
            font-family: var(--mono);
            font-size: .72rem;
            letter-spacing: .05em;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 46%;
        }

        .page {
            position: relative;
            z-index: var(--z-page);
            flex: none;
            width: 100%;
            padding: 14px var(--pad) clamp(.7rem, 1.6vw, 1.1rem);
        }

        body.dark .page {
            pointer-events: none;
        }

        .stage {
            display: flex;
            justify-content: center;
        }

        .frame {
            position: relative;
            width: var(--content);
            aspect-ratio: 16 / 9;
        }

        body.dark .frame {
            pointer-events: auto;
        }

        .frame::before {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: calc(var(--r-frame) + 4px);
            background: conic-gradient(from var(--ang),
                    #3D87FF, #22D3EE, #7C5CFF, #F5F7FF, #3D87FF);
            filter: blur(22px);
            opacity: 0;
            transition: opacity .4s ease;
            pointer-events: none;
        }

        .frame:hover::before,
        .frame:focus-within::before,
        body.dark .frame::before {
            opacity: .6;
            animation: hue 7s linear infinite;
        }

        @keyframes hue {
            to { --ang: 360deg; }
        }

        .shell {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: var(--r-frame);
            overflow: hidden;
            background: #000105;
            box-shadow:
                0 22px 70px rgba(0, 0, 3, .82),
                0 0 0 1px rgba(42, 95, 208, .3);
        }

        .frame.stalled .shell {
            filter: saturate(.35) brightness(.55);
        }

        .stall {
            position: absolute;
            inset: 0;
            z-index: 4;
            display: none;
            place-items: center;
            padding: 1rem;
            background: rgba(0, 0, 3, .72);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
        }

        .frame.stalled .stall {
            display: grid;
        }

        .stall-box {
            max-width: 26rem;
            text-align: center;
            padding: .9rem 1.1rem;
            border-radius: var(--r);
            border: 1px solid rgba(93, 157, 255, .3);
            background: rgba(4, 4, 11, .92);
            font-size: .84rem;
            line-height: 1.45;
        }

        .stall-box b {
            display: block;
            margin-bottom: .25rem;
            font-family: var(--display);
            font-weight: 600;
            letter-spacing: .03em;
        }

        .fill {
            position: absolute;
            inset: 0;
        }

        video-player,
        video-minimal-skin {
            display: block;
            width: 100%;
            height: 100%;
        }

        .shell video {
            display: block;
            width: 100%;
            height: 100%;
            background: #000105;
        }

        video-player {
            --media-accent-color: #3D87FF;
            --media-accent-text-color: #000003;
            --media-border-radius: 8px;
            --media-scale-unit: 15px;
            --media-object-fit: contain;
        }


        .lm {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: none;
            background: #000105;
        }

        .lm.on {
            display: block;
        }

        .lm-host {
            position: absolute;
            inset: 0;
        }

        .lm-host canvas,
        .lm-host video {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            background: #000105;
        }

        .lmbar {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            display: grid;
            grid-template-columns: auto auto auto 1fr auto auto;
            align-items: center;
            gap: .35rem;
            padding: 2.5rem .85rem .8rem;
            background: linear-gradient(transparent,
                    rgba(0, 0, 3, .55) 45%, rgba(0, 0, 3, .92));
            opacity: 0;
            transform: translateY(6px);
            transition: opacity .22s ease, transform .22s ease;
        }

        .lm:hover .lmbar,
        .lm.idle .lmbar,
        .lmbar:focus-within {
            opacity: 1;
            transform: none;
        }

        .lmbtn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            flex: none;
            padding: 0;
            border: 0;
            border-radius: 10px;
            background: none;
            color: var(--text);
            cursor: pointer;
            transition: background .16s ease, color .16s ease, transform .12s ease;
        }

        .lmbtn:hover {
            background: rgba(93, 157, 255, .16);
            color: var(--accent-2);
        }

        .lmbtn:active {
            transform: scale(.94);
        }

        .lmbtn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .lmbtn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .lmbtn.play {
            background: rgba(93, 157, 255, .14);
        }

        .lmbtn.play:hover {
            background: var(--accent);
            color: #000003;
        }

        .lmseek {
            position: relative;
            height: 16px;
            display: flex;
            align-items: center;
            cursor: pointer;
            touch-action: none;
        }

        .lmseek::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            height: 4px;
            border-radius: 999px;
            background: rgba(203, 210, 229, .18);
            transition: height .16s ease;
        }

        .lmseek:hover::before,
        .lmseek:focus-visible::before {
            height: 6px;
        }

        .lmseek:focus-visible {
            outline: none;
        }

        .lmfill {
            position: absolute;
            left: 0;
            height: 4px;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            transition: height .16s ease;
        }

        .lmseek:hover .lmfill,
        .lmseek:focus-visible .lmfill {
            height: 6px;
        }

        .lmfill::after {
            content: "";
            position: absolute;
            right: -6px;
            top: 50%;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text);
            box-shadow: 0 2px 8px rgba(0, 0, 3, .7);
            transform: translateY(-50%) scale(0);
            transition: transform .16s ease;
        }

        .lmseek:hover .lmfill::after,
        .lmseek:focus-visible .lmfill::after {
            transform: translateY(-50%) scale(1);
        }

        .lmtime {
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
            font-size: .74rem;
            letter-spacing: .01em;
            color: var(--muted);
            white-space: nowrap;
            flex: none;
            padding: 0 .3rem 0 .15rem;
        }

        .lmtime b {
            color: var(--text);
            font-weight: 500;
        }

        .lmvol {
            width: 0;
            opacity: 0;
            flex: none;
            accent-color: var(--accent);
            transition: width .2s ease, opacity .2s ease;
        }

        .lmbar:hover .lmvol,
        .lmvol:focus-visible {
            width: 72px;
            opacity: 1;
        }

        .lmmenu {
            position: relative;
            flex: none;
        }

        .lmpop {
            position: absolute;
            right: 0;
            bottom: calc(100% + 8px);
            display: none;
            min-width: 6rem;
            padding: .25rem;
            border-radius: var(--r);
            border: 1px solid rgba(93, 157, 255, .3);
            background: rgba(4, 4, 11, .97);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 16px 40px rgba(0, 0, 3, .85);
        }

        .lmmenu.open .lmpop {
            display: block;
        }

        .lmpop button {
            display: block;
            width: 100%;
            padding: .35rem .5rem;
            border: 0;
            border-radius: 8px;
            background: none;
            color: var(--text);
            font: inherit;
            font-size: .78rem;
            text-align: left;
            cursor: pointer;
        }

        .lmpop button:hover {
            background: var(--accent-soft);
        }

        .lmpop button[aria-selected="true"] {
            color: var(--accent-2);
        }

        .lmtime {
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
            font-size: .72rem;
            color: var(--muted);
            white-space: nowrap;
            flex: none;
        }

        .lmvol {
            width: 68px;
            flex: none;
            accent-color: var(--accent);
        }

        @media (max-width: 640px) {
            .lmvol { display: none; }
        }

        .loading {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: grid;
            place-items: center;
            background: linear-gradient(rgba(0, 0, 3, .96), rgba(0, 0, 3, .99));
            transition: opacity .25s ease, visibility .25s ease;
        }

        .loading.gone {
            opacity: 0;
            visibility: hidden;
        }

        .load-copy {
            text-align: center;
            max-width: 20rem;
            padding: 0 1rem;
        }

        .load-copy b {
            display: block;
            font-family: var(--display);
            font-weight: 600;
            font-size: .95rem;
            letter-spacing: .04em;
        }

        .load-copy span {
            display: block;
            margin-top: .25rem;
            font-size: .8rem;
            color: var(--muted);
        }

        .bar {
            height: 2px;
            width: 8rem;
            margin: .8rem auto 0;
            border-radius: 2px;
            background: rgba(93, 157, 255, .16);
            overflow: hidden;
        }

        .bar::after {
            content: "";
            display: block;
            width: 40%;
            height: 100%;
            border-radius: 2px;
            background: var(--accent);
            animation: sweep 1.4s ease-in-out infinite;
        }

        @keyframes sweep {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }

        .below {
            flex: none;
            width: var(--content);
            margin-inline: auto;
            padding-top: 14px;
            transition: opacity .45s ease;
        }

        body.dark .below {
            opacity: .05;
            pointer-events: none;
        }

        .head {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px .8rem;
        }

        .txt {
            min-width: 0;
            flex: 1 1 auto;
        }

        h1 {
            font-size: clamp(.95rem, 1.4vw, 1.2rem);
            font-weight: 700;
            letter-spacing: .005em;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta {
            display: flex;
            align-items: center;
            gap: .3rem .65rem;
            margin-top: 6px;
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
            font-size: .72rem;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta i {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--line-2);
            flex: none;
        }

        .acts {
            display: flex;
            flex-wrap: wrap;
            gap: .35rem;
            flex: 0 0 auto;
            margin-left: auto;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .45rem;
            height: 36px;
            padding: 0 .8rem;
            border-radius: var(--r);
            border: 1px solid var(--line);
            background: var(--surface-2);
            color: var(--text);
            font: inherit;
            font-size: .8rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
            transition: border-color .16s ease, background .16s ease, transform .12s ease;
        }

        .btn:hover {
            border-color: var(--line-2);
            background: var(--accent-soft);
        }

        .btn:active {
            transform: scale(.97);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
            flex: none;
        }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #000003;
            font-weight: 600;
        }

        .btn.primary:hover {
            background: var(--accent-2);
            border-color: var(--accent-2);
        }

        .btn.icon {
            width: 36px;
            padding: 0;
        }

        .btn.on {
            border-color: var(--accent);
            color: var(--accent-2);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: .4rem;
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid var(--line);
        }

        .spacer {
            flex: 1 1 auto;
        }

        .dd {
            position: relative;
            display: none;
            min-width: 0;
        }

        .dd.show {
            display: block;
        }

        .dd-btn {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            height: 36px;
            max-width: 100%;
            padding: 0 .65rem;
            border-radius: var(--r);
            border: 1px solid var(--line);
            background: var(--surface-2);
            color: var(--text);
            font: inherit;
            font-size: .78rem;
            font-weight: 500;
            cursor: pointer;
            transition: border-color .16s ease, background .16s ease;
        }

        .dd-btn:hover {
            border-color: var(--line-2);
            background: var(--accent-soft);
        }

        .dd-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .dd-btn em {
            font-family: var(--mono);
            font-style: normal;
            font-size: .62rem;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--muted);
            flex: none;
        }

        .dd-btn b {
            font-weight: 500;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .dd-btn svg {
            width: 11px;
            height: 11px;
            fill: var(--muted);
            flex: none;
            transition: transform .18s ease;
        }

        .dd.open .dd-btn svg {
            transform: rotate(180deg);
        }

        .dd-panel {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 0;
            min-width: 100%;
            width: max-content;
            max-width: min(21rem, 86vw);
            max-height: min(17rem, 46dvh);
            overflow-y: auto;
            overscroll-behavior: contain;
            scrollbar-width: thin;
            scrollbar-color: rgba(42, 95, 208, .5) transparent;
            padding: .3rem;
            border-radius: var(--r);
            border: 1px solid rgba(93, 157, 255, .28);
            background: rgba(4, 4, 11, .98);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 18px 48px rgba(0, 0, 3, .85);
            display: none;
            z-index: var(--z-pop);
        }

        .dd.down .dd-panel {
            bottom: auto;
            top: calc(100% + 6px);
        }

        .dd.right .dd-panel {
            left: auto;
            right: 0;
        }

        .dd.open .dd-panel {
            display: block;
        }

        .dd-group {
            font-family: var(--mono);
            font-size: .58rem;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--muted);
            padding: .45rem .5rem .25rem;
        }

        .dd-item {
            display: flex;
            align-items: center;
            gap: .5rem;
            width: 100%;
            padding: .42rem .5rem;
            border: 0;
            border-radius: 8px;
            background: none;
            color: var(--text);
            font: inherit;
            font-size: .78rem;
            text-align: left;
            cursor: pointer;
            transition: background .12s ease;
        }

        .dd-item:hover,
        .dd-item:focus-visible {
            background: var(--accent-soft);
            outline: none;
        }

        .dd-item[aria-selected="true"] {
            color: var(--accent-2);
        }

        .dd-item[aria-selected="true"]::after {
            content: "";
            width: 6px;
            height: 6px;
            margin-left: auto;
            border-radius: 50%;
            background: var(--accent);
            flex: none;
        }

        .notice {
            display: none;
            align-items: flex-start;
            gap: .55rem;
            border: 1px solid rgba(42, 95, 208, .45);
            border-radius: var(--r);
            background: rgba(6, 21, 63, .7);
            padding: .6rem .8rem;
            margin-bottom: .6rem;
            font-size: .82rem;
            flex: none;
        }

        .notice.show {
            display: flex;
        }

        .notice svg {
            width: 16px;
            height: 16px;
            fill: var(--accent-2);
            flex: none;
            margin-top: .15rem;
        }

        .resume {
            display: none;
            align-items: center;
            gap: .45rem;
            margin-top: .5rem;
            font-size: .8rem;
            color: var(--muted);
        }

        .resume.show {
            display: flex;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 1.2rem;
            transform: translate(-50%, 1.5rem);
            background: rgba(4, 4, 11, .97);
            border: 1px solid var(--line-2);
            border-radius: 999px;
            padding: .45rem 1rem;
            font-size: .8rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
            z-index: var(--z-toast);
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .err {
            display: grid;
            place-content: center;
            text-align: center;
            min-height: 40dvh;
            gap: .5rem;
        }

        .err h2 {
            font-family: var(--display);
            font-weight: 700;
            letter-spacing: .02em;
            margin: 0;
        }

        .err p {
            color: var(--muted);
            margin: 0;
        }

        .err a {
            justify-self: center;
            margin-top: .6rem;
        }

        @media (max-width: 900px) {
            .glyph {
                font-size: clamp(9rem, 30vmin, 16rem);
            }

            .glyph--w {
                top: .6rem;
                left: clamp(.4rem, 5vw, 2rem);
                transform: none;
            }

            .glyph--x {
                top: auto;
                bottom: 1.6rem;
                right: clamp(.5rem, 3.5vw, 1.8rem);
                transform: none;
            }
        }

        @media (max-width: 900px) {
            .acts {
                margin-left: 0;
                width: 100%;
            }

            .acts .btn:first-child {
                flex: 1 1 auto;
            }
        }

        @media (max-width: 640px) {
            :root {
                --pad: 16px;
                --bar-pad: 14px;
                --chrome: 18.5rem;
            }

            body {
                font-size: 15px;
            }

            .topbar {
                height: 48px;
                border-radius: 14px;
            }

            .wordmark {
                font-size: .9rem;
            }

            .now {
                display: none;
            }

            .shell {
                border-radius: 14px;
            }

            video-player {
                --media-scale-unit: 13px;
            }

            h1 {
                font-size: .92rem;
            }

            .meta {
                font-size: .68rem;
            }

            .btn {
                height: 34px;
                padding: 0 .6rem;
                font-size: .76rem;
            }

            .btn.icon {
                width: 34px;
            }

            .dd-btn {
                height: 34px;
                font-size: .74rem;
                padding: 0 .5rem;
            }

            .dd-btn em {
                display: none;
            }

            .controls {
                gap: .3rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>

                    fill="none" stroke="#3D87FF" stroke-width="11.1" stroke-linecap="round" stroke-linejoin="round" />

    <main class="page" id="root">

                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM13 3.2v2.1a6.8 6.8 0 0 1 0 13.4v2.1a8.9 8.9 0 0 0 0-17.6z"/></svg>
                            </button>
                            <input class="lmvol" id="lmVol" type="range" min="0" max="1"

                            <span class="lmtime" id="lmTime"><b>0:00</b> / 0:00</span>

                            <div class="lmmenu">
                                <button class="lmbtn" type="button" id="lmGear"
                                    aria-label="Playback speed" aria-expanded="false">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm7.4-1.6.1-.4-.1-.4 1.7-1.3-1.7-3-2 .7a6.7 6.7 0 0 0-1.4-.8L15.7 5h-3.4l-.3 2.1a6.7 6.7 0 0 0-1.4.8l-2-.7-1.7 3 1.7 1.3-.1.4.1.4-1.7 1.3 1.7 3 2-.7c.4.3.9.6 1.4.8l.3 2.1h3.4l.3-2.1c.5-.2 1-.5 1.4-.8l2 .7 1.7-3-1.7-1.3z"/></svg>
                                </button>
                                <div class="lmpop" id="lmRates" role="listbox"></div>

                            <button class="lmbtn" type="button" id="lmFs" aria-label="Fullscreen">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9V3h6v2H5v4H3zm12-6h6v6h-2V5h-4V3zM3 15h2v4h4v2H3v-6zm16 0h2v6h-6v-2h4v-4z"/></svg>
                            </button>

                    </div>
                    <div class="stall">

                    <div class="loading" id="loading">

                </div>

        </div>

        <div class="below">
            <div class="head">
                <div class="txt">
                    <h1 id="title">Loading</h1>
                    <div class="meta" id="meta"></div>
                </div>
                <div class="acts">
                    <a class="btn primary" id="dl" href="#" download>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 3v10.6l3.3-3.3 1.4 1.4L12 17.4l-4.7-4.7 1.4-1.4 3.3 3.3V3h2zM5 19h14v2H5v-2z" />
                        </svg>
                        Download
                    </a>
                    <button class="btn icon" type="button" id="lights" title="Turn the lights off"
                        aria-label="Turn the lights off" aria-pressed="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M12 2a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2zm-3 18h6v1a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-1z" />
                        </svg>
                    </button>
                    <button class="btn icon" type="button" id="copy" title="Copy page link"
                        aria-label="Copy page link">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z" />
                        </svg>
                    </button>
                    <button class="btn icon" type="button" id="copyDl" title="Copy direct link"
                        aria-label="Copy direct link">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M3.9 12a3.1 3.1 0 0 1 3.1-3.1h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12zM8 13h8v-2H8v2zm9-6h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="resume" id="resume">
                <span id="resumeText"></span>
                <button class="btn" type="button" id="resumeGo">Resume</button>
                <button class="btn" type="button" id="resumeNo">Start over</button>

            <div class="controls">
                <div class="dd" id="audDd"></div>

    </main>

    <div class="toast" id="toast"></div>

    <script type="module"
        src="https://cdn.jsdelivr.net/npm/@videojs/html@10.0.0-beta.31/cdn/video-minimal.js"></script>
    <script>
        (function () {
            "use strict";

            var TOKEN = (location.pathname.split("/").filter(Boolean).pop() || "");
            var STREAM = location.origin + "/stream/" + encodeURIComponent(TOKEN);
            var DIRECT = location.origin + "/dl/" + encodeURIComponent(TOKEN);
            var POS_KEY = "wzx:pos:" + TOKEN;
            var PREF_KEY = "wzx:prefs";

            var el = function (id) { return document.getElementById(id); };
            var vid = el("player");
            var FILE = "Video";
            var MIME = "";

            function store(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
            function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
            function prefs() { try { return JSON.parse(load(PREF_KEY) || "{}"); } catch (e) { return {}; } }
            function savePrefs(p) { store(PREF_KEY, JSON.stringify(p)); }

            function toast(text) {
                var t = el("toast");
                t.textContent = text;
                t.classList.add("show");
                setTimeout(function () { t.classList.remove("show"); }, 1900);
            }

            function bytes(n) {
                if (!n) return "unknown size";
                var u = ["B", "KB", "MB", "GB", "TB"], i = 0, v = n;
                while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
                return (i === 0 ? v : v.toFixed(v < 10 ? 2 : 1)) + " " + u[i];
            }

            function clock(s) {
                if (!isFinite(s) || s <= 0) return "";
                s = Math.floor(s);
                var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), q = s % 60;
                var pad = function (x) { return x < 10 ? "0" + x : "" + x; };
                return (h ? h + ":" + pad(m) : "" + m) + ":" + pad(q);
            }

            function stall(head, body) {
                var box = el("stallText");
                box.innerHTML = "";
                var b = document.createElement("b");
                b.textContent = head;
                box.appendChild(b);
                box.appendChild(document.createTextNode(body));
                el("frame").classList.add("stalled");
            }

            function clearStall() {
                el("frame").classList.remove("stalled");
            }

            function notice(html) {
                el("noticeText").innerHTML = html;
                el("notice").classList.add("show");
            }

            function fatal(head, body) {
                el("root").innerHTML = '<div class="err"><h2></h2><p></p>' +
                    '<a class="btn primary" href="/">Back to WZML-X</a></div>';
                el("root").querySelector("h2").textContent = head;
                el("root").querySelector("p").textContent = body;
            }

            function detectOS() {
                var ua = navigator.userAgent || "";
                if (/android/i.test(ua)) return "android";
                if (/iPad|iPhone|iPod/.test(ua)) return "ios";
                if (/Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1) return "ios";
                if (/Macintosh|Mac OS X/.test(ua)) return "mac";
                return "desktop";
            }

            var CHEV = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
                '<path d="M7 10l5 5 5-5z"/></svg>';

            function dropdown(host, label, groups, current, onPick, alignRight) {
                host.innerHTML = "";
                host.classList.add("show");
                if (alignRight) host.classList.add("right");

                var btn = document.createElement("button");
                btn.type = "button";
                btn.className = "dd-btn";
                btn.setAttribute("aria-haspopup", "listbox");
                btn.setAttribute("aria-expanded", "false");
                var lab = document.createElement("em");
                lab.textContent = label;
                var val = document.createElement("b");
                btn.appendChild(lab);
                btn.appendChild(val);
                btn.insertAdjacentHTML("beforeend", CHEV);

                var panel = document.createElement("div");
                panel.className = "dd-panel";
                panel.setAttribute("role", "listbox");

                function setLabel(t) { val.textContent = t; }

                groups.forEach(function (g) {
                    if (g.label) {
                        var h = document.createElement("div");
                        h.className = "dd-group";
                        h.textContent = g.label;
                        panel.appendChild(h);
                    }
                    g.items.forEach(function (it) {
                        var b = document.createElement("button");
                        b.type = "button";
                        b.className = "dd-item";
                        b.setAttribute("role", "option");
                        b.textContent = it.label;
                        if (it.value === current) {
                            b.setAttribute("aria-selected", "true");
                            setLabel(it.label);
                        }
                        b.onclick = function () {
                            close();
                            var sel = panel.querySelectorAll('[aria-selected="true"]');
                            Array.prototype.forEach.call(sel, function (n) {
                                n.removeAttribute("aria-selected");
                            });
                            if (it.sticky !== false) {
                                b.setAttribute("aria-selected", "true");
                                setLabel(it.label);
                            }
                            onPick(it);
                        };
                        panel.appendChild(b);
                    });
                });

                function open() {
                    host.classList.add("open");
                    btn.setAttribute("aria-expanded", "true");
                    host.classList.toggle("down",
                        host.getBoundingClientRect().top < 300);
                    document.addEventListener("pointerdown", away, true);
                    document.addEventListener("keydown", esc, true);
                }
                function close() {
                    host.classList.remove("open");
                    btn.setAttribute("aria-expanded", "false");
                    document.removeEventListener("pointerdown", away, true);
                    document.removeEventListener("keydown", esc, true);
                }
                function away(e) { if (!host.contains(e.target)) close(); }
                function esc(e) { if (e.key === "Escape") { close(); btn.focus(); } }

                btn.onclick = function () {
                    if (host.classList.contains("open")) close(); else open();
                };

                host.appendChild(btn);
                host.appendChild(panel);
                return { setLabel: setLabel };
            }

            function m3u() {
                var text = "#EXTM3U\n#EXTINF:-1," + FILE + "\n" + STREAM + "\n";
                return "data:audio/x-mpegurl;charset=utf-8," + encodeURIComponent(text);
            }

            function intent(pkg) {
                return "intent:" + STREAM + "#Intent;package=" + pkg +
                    ";type=video/*;S.title=" + encodeURIComponent(FILE) + ";end";
            }

            function catalogue() {
                var enc = encodeURIComponent(STREAM);
                return {
                    android: [
                        ["VLC", intent("org.videolan.vlc")],
                        ["MX Player", intent("com.mxtech.videoplayer.ad")],
                        ["MX Player Pro", intent("com.mxtech.videoplayer.pro")],
                        ["nPlayer", intent("com.newin.nplayer.pro")],
                        ["Just Player", intent("com.brouken.player")],
                        ["Kodi", intent("org.xbmc.kodi")],
                        ["Web Video Cast", intent("com.instantbits.cast.webvideo")],
                        ["Any player", "intent:" + STREAM + "#Intent;type=video/*;end"]
                    ],
                    ios: [
                        ["Infuse", "infuse://x-callback-url/play?url=" + enc],
                        ["VLC", "vlc-x-callback://x-callback-url/stream?url=" + enc],
                        ["nPlayer", "nplayer-" + STREAM],
                        ["Outplayer", "outplayer://" + STREAM],
                        ["SenPlayer", "senplayer://x-callback-url/play?url=" + enc],
                        ["VidHub", "open-vidhub://x-callback-url/open?url=" + enc],
                        ["KMPlayer", "kmplayer://" + STREAM],
                        ["PlayerXtreme", "playerxtreme://" + STREAM]
                    ],
                    mac: [
                        ["IINA", "iina://weblink?url=" + enc],
                        ["VLC", "vlc://" + STREAM],
                        ["Infuse", "infuse://x-callback-url/play?url=" + enc],
                        ["nPlayer", "nplayer-" + STREAM],
                        ["VidHub", "open-vidhub://x-callback-url/open?url=" + enc],
                        ["Playlist file", m3u()]
                    ],
                    desktop: [
                        ["VLC", "vlc://" + STREAM],
                        ["PotPlayer", "potplayer://" + STREAM],
                        ["MPC-HC", "mpc-hc://" + STREAM],
                        ["Kodi", "kodi://" + STREAM],
                        ["Playlist file", m3u()]
                    ]
                };
            }

            var OS_LABEL = {
                android: "Android",
                ios: "iOS / iPadOS",
                mac: "macOS",
                desktop: "Windows / Linux"
            };

            function buildApps() {
                var cat = catalogue();
                var here = detectOS();
                var order = [here].concat(["android", "ios", "mac", "desktop"].filter(
                    function (k) { return k !== here; }));
                var groups = order.map(function (k) {
                    return {
                        label: OS_LABEL[k],
                        items: cat[k].map(function (p) {
                            return {
                                label: p[0], value: p[1],
                                file: p[0] === "Playlist file", sticky: false
                            };
                        })
                    };
                });
                dropdown(el("appDd"), "Open in", groups, null, function (it) {
                    if (it.file) {
                        var a = document.createElement("a");
                        a.href = it.value;
                        a.download = FILE + ".m3u";
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                    } else {
                        window.location.href = it.value;
                    }
                }, true);
                el("appDd").querySelector(".dd-btn b").textContent = "an app";
            }

            var wanted = null;

            function holdSubtitle() {
                if (!wanted) return;
                if (wanted.mode !== "showing") wanted.mode = "showing";
                for (var i = 0; i < vid.textTracks.length; i++) {
                    var t = vid.textTracks[i];
                    if (t !== wanted && t.mode === "showing") t.mode = "disabled";
                }
            }


            var LM_SRC = "https://cdn.jsdelivr.net/npm/@libmedia/avplayer@1.3.1" +
                "/dist/umd/avplayer.js";
            var lm = null;
            var lmLoading = null;
            var lmStreams = [];

            function lmErr(e) {
                try { console.error("[wzx] libmedia", e); } catch (x) { }
            }

            function lmLog(m, extra) {
                try {
                    if (extra === undefined) console.info("[wzx] " + m);
                    else console.info("[wzx] " + m, extra);
                } catch (x) { }
            }

            function loadLibmedia() {
                if (window.AVPlayer) return Promise.resolve(window.AVPlayer);
                if (lmLoading) return lmLoading;
                lmLog("fetching decoder", LM_SRC);
                lmLoading = new Promise(function (ok, no) {
                    var sc = document.createElement("script");
                    sc.src = LM_SRC;
                    sc.crossOrigin = "anonymous";
                    sc.onload = function () {
                        lmLog("decoder script loaded, AVPlayer=" + typeof window.AVPlayer);
                        if (window.AVPlayer) ok(window.AVPlayer);
                        else no(new Error("AVPlayer global missing after load"));
                    };
                    sc.onerror = function (e) {
                        lmErr(e);
                        no(new Error("decoder script failed to load"));
                    };
                    document.head.appendChild(sc);
                });
                return lmLoading;
            }

            function lmIcon(playing) {
                var b = el("lmPlay");
                b.innerHTML = playing
                    ? '<svg viewBox="0 0 24 24" aria-hidden="true">'
                      + '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>'
                    : '<svg viewBox="0 0 24 24" aria-hidden="true">'
                      + '<path d="M8 5v14l11-7z"/></svg>';
                b.setAttribute("aria-label", playing ? "Pause" : "Play");
            }

            function lmDuration() {
                try {
                    if (typeof lm.getDuration === "function") {
                        return Number(lm.getDuration()) / 1000;
                    }
                } catch (e) { }
                return 0;
            }

            function lmSeekTo(sec) {
                sec = Math.max(0, sec);
                try {
                    lm.seek(BigInt(Math.round(sec * 1000)));
                } catch (e) {
                    try { lm.seek(Math.round(sec * 1000)); } catch (e2) { lmErr(e2); }
                }
            }

            var lmPlaying = false;
            var lmMuted = false;
            var lmLastVol = 1;

            function lmClock(t, dur) {
                var s = Math.max(0, Math.floor(t));
                var h = Math.floor(s / 3600);
                var m = Math.floor((s % 3600) / 60);
                var q = s % 60;
                var pad = function (x) { return x < 10 ? "0" + x : "" + x; };
                if (dur >= 3600) return h + ":" + pad(m) + ":" + pad(q);
                return m + ":" + pad(q);
            }

            function lmWireBar() {
                var seek = el("lmSeek"), fill = el("lmFill"), dur = 0, at = 0;

                function paint(t) {
                    at = t;
                    if (!dur) dur = lmDuration();
                    if (!dur) return;
                    var pct = Math.max(0, Math.min(100, (t / dur) * 100));
                    fill.style.width = pct + "%";
                    el("lmTime").innerHTML = "<b></b> / ";
                    el("lmTime").firstChild.textContent = lmClock(t, dur);
                    el("lmTime").appendChild(
                        document.createTextNode(lmClock(dur, dur)));
                    seek.setAttribute("aria-valuenow", Math.round(pct));
                    if (t > 30) store(POS_KEY, String(t));
                }

                lm.on("time", function (pts) { paint(Number(pts) / 1000); });
                lm.on("played", function () { lmPlaying = true; lmIcon(true); });
                lm.on("playing", function () {
                    lmPlaying = true;
                    lmIcon(true);
                    clearStall();
                });
                lm.on("paused", function () { lmPlaying = false; lmIcon(false); });
                lm.on("stopped", function () { lmPlaying = false; lmIcon(false); });
                lm.on("ended", function () {
                    lmPlaying = false;
                    lmIcon(false);
                    store(POS_KEY, "0");
                });
                lm.on("error", function (e) {
                    lmErr(e);
                    stall("Playback failed",
                        "The decoder could not continue. Download the file, or open "
                        + "it in an app below.");
                });

                // libmedia exposes no isPlaying(), so the state is tracked from
                // its own events instead of being asked for.
                el("lmPlay").onclick = function () {
                    try {
                        if (lmPlaying) {
                            lm.pause();
                            lmPlaying = false;
                        } else {
                            lm.play();
                            lmPlaying = true;
                        }
                        lmIcon(lmPlaying);
                    } catch (e) {
                        lmErr(e);
                    }
                };

                el("lmMute").onclick = function () {
                    lmMuted = !lmMuted;
                    try { lm.setVolume(lmMuted ? 0 : lmLastVol); } catch (e) { lmErr(e); }
                    el("lmVol").value = lmMuted ? 0 : lmLastVol;
                    this.style.opacity = lmMuted ? ".5" : "1";
                };

                var rates = [0.5, 0.75, 1, 1.25, 1.5, 2];
                var pop = el("lmRates");
                pop.innerHTML = "";
                rates.forEach(function (r) {
                    var b = document.createElement("button");
                    b.type = "button";
                    b.setAttribute("role", "option");
                    b.textContent = r + "x";
                    if (r === 1) b.setAttribute("aria-selected", "true");
                    b.onclick = function () {
                        try { lm.setPlaybackRate(r); } catch (e) { lmErr(e); }
                        var sel = pop.querySelectorAll('[aria-selected="true"]');
                        Array.prototype.forEach.call(sel, function (n) {
                            n.removeAttribute("aria-selected");
                        });
                        b.setAttribute("aria-selected", "true");
                        el("lmGear").parentNode.classList.remove("open");
                        var q = prefs(); q.rate = r; savePrefs(q);
                    };
                    pop.appendChild(b);
                });
                el("lmGear").onclick = function () {
                    var box = this.parentNode;
                    box.classList.toggle("open");
                    this.setAttribute("aria-expanded",
                        box.classList.contains("open") ? "true" : "false");
                };

                var dragging = false;

                function seekFromEvent(ev) {
                    if (!dur) dur = lmDuration();
                    if (!dur) return;
                    var r = seek.getBoundingClientRect();
                    var cx = ev.clientX !== undefined ? ev.clientX
                        : (ev.touches && ev.touches[0] ? ev.touches[0].clientX : 0);
                    var x = Math.max(0, Math.min(1, (cx - r.left) / r.width));
                    fill.style.width = (x * 100) + "%";
                    return x * dur;
                }

                seek.addEventListener("pointerdown", function (ev) {
                    dragging = true;
                    seek.setPointerCapture && seek.setPointerCapture(ev.pointerId);
                    seekFromEvent(ev);
                });
                seek.addEventListener("pointermove", function (ev) {
                    if (dragging) seekFromEvent(ev);
                });
                seek.addEventListener("pointerup", function (ev) {
                    if (!dragging) return;
                    dragging = false;
                    var t = seekFromEvent(ev);
                    if (t !== undefined) lmSeekTo(t);
                });
                seek.addEventListener("pointercancel", function () {
                    dragging = false;
                });

                seek.addEventListener("keydown", function (ev) {
                    if (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
                    ev.preventDefault();
                    lmSeekTo(at + (ev.key === "ArrowRight" ? 10 : -10));
                });

                el("lmVol").oninput = function () {
                    var v = parseFloat(this.value);
                    lmLastVol = v || lmLastVol;
                    lmMuted = v === 0;
                    el("lmMute").style.opacity = lmMuted ? ".5" : "1";
                    try { lm.setVolume(v); } catch (e) { lmErr(e); }
                    var q = prefs(); q.volume = v; savePrefs(q);
                };

                el("lmFs").onclick = function () {
                    var box = el("frame");
                    if (document.fullscreenElement) document.exitFullscreen();
                    else if (box.requestFullscreen) box.requestFullscreen();
                };
            }

            function lmLabel(t, i) {
                var m = t.metadata || {};
                var bits = [];
                if (m.title) bits.push(m.title);
                if (m.language) bits.push(m.language);
                return bits.length ? bits.join(" \u00b7 ") : "Track " + (i + 1);
            }

            function lmByType(kind) {
                return lmStreams.filter(function (t) { return t.mediaType === kind; });
            }

            function lmRebuildMenus() {
                var auds = lmByType(1), subs = lmByType(3);
                if (auds.length > 1) {
                    dropdown(el("audDd"), "Audio",
                        [{ items: auds.map(function (t, i) {
                            return { label: lmLabel(t, i), value: String(t.id) };
                        }) }],
                        String(auds[0].id),
                        function (it) {
                            Promise.resolve(lm.selectAudio(Number(it.value)))
                                .then(function () {
                                    toast("Switched to " + it.label);
                                })
                                .catch(lmErr);
                        });
                }
                if (subs.length) {
                    var items = [{ label: "Off", value: "-1" }].concat(
                        subs.map(function (t, i) {
                            return { label: lmLabel(t, i), value: String(t.id) };
                        }));
                    dropdown(el("subDd"), "Subs", [{ items: items }], "-1",
                        function (it) {
                            if (it.value === "-1") {
                                try {
                                    if (lm.unselectSubtitle) lm.unselectSubtitle();
                                } catch (e) { lmErr(e); }
                                return;
                            }
                            Promise.resolve(lm.selectSubtitle(Number(it.value)))
                                .catch(lmErr);
                        });
                }
            }

            // The native menu numbers audio tracks 0,1,2 among audio streams only
            // (that is what ffprobe reports). libmedia wants the global stream
            // index, where the video stream usually occupies 0. Translate.
            function lmPickAudio(nth) {
                var auds = lmByType(1);
                if (!auds.length) {
                    lmLog("no audio streams to pick from");
                    return Promise.resolve();
                }
                var target = auds[nth] || auds[0];
                lmLog("selectAudio nth=" + nth + " -> id " + target.id);
                return Promise.resolve(lm.selectAudio(target.id))
                    .then(function () { lmLog("selectAudio resolved"); })
                    .catch(lmErr);
            }

            function startLibmedia(atSec, audioIndex) {
                if (lm) {
                    if (typeof audioIndex === "number") lmPickAudio(audioIndex);
                    return Promise.resolve(true);
                }
                lmLog("startLibmedia at=" + atSec + " audioIndex=" + audioIndex);
                return loadLibmedia().then(function (Ctor) {
                    lmLog("constructing AVPlayer");
                    try { vid.pause(); } catch (e) { }
                    vid.removeAttribute("src");
                    try { vid.load(); } catch (e) { }
                    el("lm").classList.add("on");
                    el("loading").classList.remove("gone");
                    el("loadingText").textContent = "Starting the advanced decoder";

                    lm = new Ctor({
                        container: el("lmHost"),
                        enableWorker: true,
                        enableHardware: true,
                        isLive: false
                    });
                    lmWireBar();
                    lmLog("loading source", STREAM);
                    return lm.load(STREAM).then(function () {
                        lmStreams = lm.getStreams ? lm.getStreams() : [];
                        lmLog("streams", lmStreams.map(function (t) {
                            return { id: t.id, index: t.index, mediaType: t.mediaType };
                        }));
                        var p = prefs();
                        if (typeof p.volume === "number") {
                            try { lm.setVolume(p.volume); } catch (e) { }
                            el("lmVol").value = p.volume;
                        }
                        if (typeof p.rate === "number" && p.rate > 0) {
                            try { lm.setPlaybackRate(p.rate); } catch (e) { }
                            var opts = el("lmRates").querySelectorAll("button");
                            Array.prototype.forEach.call(opts, function (n) {
                                if (parseFloat(n.textContent) === p.rate) {
                                    n.setAttribute("aria-selected", "true");
                                } else {
                                    n.removeAttribute("aria-selected");
                                }
                            });
                        }
                        if (typeof audioIndex === "number") {
                            lmPickAudio(audioIndex);
                        }
                        return lm.play();
                    }).then(function () {
                        lmLog("playing");
                        if (atSec > 1) lmSeekTo(atSec);
                        el("loading").classList.add("gone");
                        clearStall();
                        lmRebuildMenus();
                        toast("Using the advanced decoder");
                        return true;
                    });
                }).catch(function (e) {
                    lmErr(e);
                    el("loading").classList.add("gone");
                    stall("Cannot play this file",
                        "The advanced decoder could not handle it. Download the file, "
                        + "or open it in an app below.");
                    return false;
                });
            }

            function applyTracks(info) {
                var auds = (info && info.audio) || [];
                var subs = (info && info.subtitle) || [];
                lmLog("probe: " + auds.length + " audio, " + subs.length + " subtitle");

                // A native media element cannot switch audio tracks, so a file with
                // more than one is handed to the decoder up front rather than being
                // swapped over mid playback.
                if (auds.length > 1) {
                    lmLog("multi audio file, using the decoder from the start");
                    startLibmedia(0);
                    return;
                }

                if (subs.length) {
                    var items = [{ label: "Off", value: "-1" }].concat(
                        subs.map(function (t) {
                            return { label: t.title, value: String(t.index) };
                        }));
                    dropdown(el("subDd"), "Subs", [{ items: items }], "-1",
                        function (it) {
                            var old = vid.querySelectorAll("track");
                            Array.prototype.forEach.call(old, function (n) { n.remove(); });
                            for (var i = 0; i < vid.textTracks.length; i++) {
                                vid.textTracks[i].mode = "disabled";
                            }
                            wanted = null;
                            if (it.value === "-1") return;
                            var tr = document.createElement("track");
                            tr.kind = "subtitles";
                            tr.label = it.label;
                            tr.src = location.origin + "/subs/" +
                                encodeURIComponent(TOKEN) + "/" +
                                encodeURIComponent(it.value) + ".vtt";
                            tr.srclang = "und";
                            vid.appendChild(tr);
                            wanted = tr.track || null;
                            if (wanted) wanted.mode = "showing";
                            tr.addEventListener("load", function () {
                                wanted = tr.track || wanted;
                                if (wanted) wanted.mode = "showing";
                            });
                            tr.addEventListener("error", function () {
                                wanted = null;
                                toast("Could not load that subtitle track");
                            });
                            toast("Extracting subtitles, cues appear as they load");
                        });
                }
            }

            function loadTracks() {
                fetch("/api/tracks/" + encodeURIComponent(TOKEN), { cache: "no-store" })
                    .then(function (r) { return r.ok ? r.json() : null; })
                    .then(function (t) { if (t) applyTracks(t); })
                    .catch(function () { });
            }

            function wireResume() {
                var saved = parseFloat(load(POS_KEY) || "0");
                var dur = vid.duration;
                if (saved > 30 && isFinite(dur) && saved < dur - 30) {
                    el("resumeText").textContent = "Stopped at " + clock(saved);
                    el("resume").classList.add("show");
                    el("resumeGo").onclick = function () {
                        vid.currentTime = saved;
                        el("resume").classList.remove("show");
                        vid.play();
                    };
                    el("resumeNo").onclick = function () {
                        store(POS_KEY, "0");
                        el("resume").classList.remove("show");
                    };
                }
                var last = 0;
                vid.addEventListener("timeupdate", function () {
                    var now = vid.currentTime;
                    if (Math.abs(now - last) < 5) return;
                    last = now;
                    store(POS_KEY, String(now));
                });
                vid.addEventListener("ended", function () { store(POS_KEY, "0"); });
            }

            function addMeta(text) {
                var box = el("meta");
                if (box.children.length) box.appendChild(document.createElement("i"));
                var s = document.createElement("span");
                s.textContent = text;
                box.appendChild(s);
            }

            function start(info) {
                FILE = info.name || "Untitled";
                MIME = info.mime || "";
                document.title = FILE + " · WZML-X";
                el("title").textContent = FILE;
                el("title").title = FILE;
                el("now").textContent = FILE;
                el("dl").href = DIRECT;
                el("dl").setAttribute("download", FILE);
                buildApps();
                loadTracks();
                if (vid.textTracks) {
                    vid.textTracks.addEventListener("change", holdSubtitle);
                }
                addMeta(bytes(info.size));
                if (MIME) addMeta(MIME);

                var p = prefs();
                if (typeof p.volume === "number") vid.volume = p.volume;
                if (p.muted) vid.muted = true;
                if (typeof p.rate === "number" && p.rate > 0) vid.playbackRate = p.rate;

                vid.addEventListener("volumechange", function () {
                    var q = prefs();
                    q.volume = vid.volume;
                    q.muted = vid.muted;
                    savePrefs(q);
                });
                vid.addEventListener("ratechange", function () {
                    var q = prefs();
                    q.rate = vid.playbackRate;
                    savePrefs(q);
                });

                var once = false;
                vid.addEventListener("loadedmetadata", function () {
                    el("loading").classList.add("gone");
                    if (once) return;
                    once = true;
                    if (isFinite(vid.duration) && vid.duration > 0) {
                        addMeta(clock(vid.duration));
                    }
                    wireResume();
                });

                vid.addEventListener("playing", clearStall);
                vid.addEventListener("loadstart", clearStall);

                vid.addEventListener("loadeddata", function () {
                    if (!vid.videoWidth && !vid.videoHeight) {
                        startLibmedia(Math.max(0, vid.currentTime || 0));
                    }
                });

                vid.addEventListener("error", function () {
                    el("loading").classList.add("gone");
                    var e = vid.error;
                    if (e && e.code === 4) {
                        stall("Switching decoder",
                            "This browser cannot decode the file natively. Loading "
                            + "the advanced decoder.");
                        startLibmedia(Math.max(0, vid.currentTime || 0));
                    } else {
                        stall("Playback stopped",
                            "The connection dropped or the link expired. Reload " +
                            "the page, or pick a player below.");
                    }
                });

                if (MIME) vid.setAttribute("type", MIME);
                vid.src = STREAM;

                setTimeout(function () {
                    if (!el("loading").classList.contains("gone")) {
                        el("loadingText").textContent =
                            "Still buffering, large files take a moment";
                    }
                }, 6000);
            }

            (function () {
                if (!window.matchMedia || !matchMedia("(hover: hover)").matches) return;
                var root = document.documentElement;
                var px = 0, py = 0, queued = false;
                function paint() {
                    queued = false;
                    root.style.setProperty("--mx", px + "px");
                    root.style.setProperty("--my", py + "px");
                }
                window.addEventListener("pointermove", function (e) {
                    px = e.clientX;
                    py = e.clientY;
                    if (!document.body.classList.contains("tracking")) {
                        document.body.classList.add("tracking");
                    }
                    if (!queued) {
                        queued = true;
                        requestAnimationFrame(paint);
                    }
                }, { passive: true });
                window.addEventListener("pointerleave", function () {
                    document.body.classList.remove("tracking");
                });
            })();

            function setLights(on) {
                var b = el("lights");
                document.body.classList.toggle("dark", on);
                b.classList.toggle("on", on);
                b.setAttribute("aria-pressed", on ? "true" : "false");
                b.title = on ? "Turn the lights on" : "Turn the lights off";
                b.setAttribute("aria-label", b.title);
            }

            el("lights").onclick = function () {
                setLights(!document.body.classList.contains("dark"));
            };
            el("dimmer").addEventListener("click", function () { setLights(false); });
            el("dimmer").addEventListener("touchend", function (e) {
                e.preventDefault();
                setLights(false);
            });
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape" && document.body.classList.contains("dark")) {
                    setLights(false);
                }
            });

            el("copy").onclick = function () {
                navigator.clipboard.writeText(location.href).then(
                    function () { toast("Page link copied"); },
                    function () { toast("Copy failed"); });
            };
            el("copyDl").onclick = function () {
                navigator.clipboard.writeText(DIRECT).then(
                    function () { toast("Direct link copied"); },
                    function () { toast("Copy failed"); });
            };

            if (!TOKEN) {
                fatal("Nothing to play", "This link is missing its file reference.");
                return;
            }

            fetch("/api/stream/" + encodeURIComponent(TOKEN), { cache: "no-store" })
                .then(function (r) {
                    if (r.status === 404) throw new Error("gone");
                    if (!r.ok) throw new Error("bad");
                    return r.json();
                })
                .then(start)
                .catch(function (e) {
                    if (e && e.message === "gone") {
                        fatal("This file is no longer available",
                            "It was removed from the source chat, or the link is wrong.");
                    } else {
                        fatal("Could not load this file",
                            "The streaming service did not respond. Try again shortly.");
                    }
                });
        })();
    </script>
</body>

</html>
