<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#00000C">
    <title>Stream — WZML-X</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22.5' fill='%23F5F7FF'/%3E%3Cpath d='M 19.4 42.6 C 20.0 55.4 22.4 66.4 29.8 68.3 C 37.0 70.1 43.2 61.0 45.2 48.8 C 47.5 61.0 53.4 66.6 61.0 68.3 C 68.6 70.0 75.6 55.5 80.6 35.3' fill='none' stroke='%233D87FF' stroke-width='11.1' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Tektur:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --bg: #00000C;
            --surface: #010116;
            --surface-2: #02021F;
            --line: #16409E;
            --line-2: #2A5FD0;
            --text: #F5F7FF;
            --muted: #CBD2E5;
            --accent: #3D87FF;
            --accent-2: #5B9DFF;
            --accent-soft: #071D5C;
            --r-lg: 22px;
            --r-md: 14px;
            --r-sm: 10px;
            --sans: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --display: 'Tektur', 'Montserrat', system-ui, sans-serif;
            --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 15px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: .5;
            background:
                linear-gradient(rgba(42, 95, 208, .16) 1px, transparent 1px) 50% / 12px 12px,
                linear-gradient(90deg, rgba(42, 95, 208, .16) 1px, transparent 1px) 50% / 12px 12px,
                radial-gradient(circle at 50% 18%, rgba(61, 135, 255, .13), transparent 26%),
                radial-gradient(circle at 50% 90%, rgba(7, 29, 92, .5), transparent 42%);
        }

        .glyph {
            position: fixed;
            z-index: 0;
            font-family: var(--display);
            font-size: clamp(12rem, 24vw, 26rem);
            font-weight: 600;
            line-height: .8;
            letter-spacing: -.08em;
            color: #080f26;
            filter: drop-shadow(0 0 42px rgba(0, 0, 12, .9));
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
            animation: fade 1.2s cubic-bezier(.16, 1, .3, 1) both;
        }

        .glyph::before {
            content: attr(data-letter);
            position: absolute;
            inset: 0;
            color: transparent;
            background:
                radial-gradient(circle at 40% 25%, rgba(93, 157, 255, .34), transparent 34%),
                radial-gradient(circle at 60% 75%, rgba(61, 135, 255, .13), transparent 36%),
                linear-gradient(rgba(245, 247, 255, .16), rgba(245, 247, 255, .04));
            -webkit-background-clip: text;
            background-clip: text;
            filter: blur(22px);
            opacity: .9;
            transform: scale(1.06);
        }

        .glyph::after {
            content: attr(data-letter);
            position: absolute;
            inset: 0;
            color: rgba(203, 210, 229, .13);
            text-shadow: 0 0 18px rgba(93, 157, 255, .12), 0 0 60px rgba(0, 0, 12, .92);
            transform: scale(1.01);
        }

        .glyph--w {
            top: 50%;
            left: clamp(.25rem, 1.5vw, 1.75rem);
            transform: translateY(-50%) scaleX(.92);
        }

        .glyph--x {
            top: 50%;
            right: clamp(1rem, 3vw, 3rem);
            transform: translateY(-50%) scaleX(.92);
        }

        @keyframes fade {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: .7rem;
            padding: .8rem clamp(.9rem, 3vw, 2rem);
            background: rgba(1, 1, 22, .72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(42, 95, 208, .22);
        }

        .topbar svg {
            width: 26px;
            height: 26px;
            flex: none;
            border-radius: 7px;
        }

        .wordmark {
            font-family: var(--display);
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: .06em;
        }

        .wordmark a {
            color: var(--text);
            text-decoration: none;
        }

        .now {
            margin-left: auto;
            font-family: var(--mono);
            font-size: .72rem;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 45%;
        }

        .page {
            position: relative;
            z-index: 1;
            max-width: 1140px;
            margin: 0 auto;
            padding: clamp(1rem, 3vw, 2rem) clamp(.9rem, 3vw, 2rem) 4rem;
        }

        .rise {
            animation: rise .6s cubic-bezier(.16, 1, .3, 1) both;
        }

        .rise:nth-child(2) { animation-delay: .06s; }
        .rise:nth-child(3) { animation-delay: .12s; }
        .rise:nth-child(4) { animation-delay: .18s; }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .stage {
            display: flex;
            justify-content: center;
        }

        .shell {
            position: relative;
            width: min(1080px, 100%);
            aspect-ratio: 16 / 9;
            border-radius: var(--r-lg);
            overflow: hidden;
            background: #000208;
            box-shadow:
                0 24px 80px rgba(0, 0, 12, .78),
                0 0 0 1px rgba(42, 95, 208, .34),
                0 0 70px -14px rgba(61, 135, 255, .42);
        }

        .shell.dead {
            display: none;
        }

        video-player {
            display: block;
            width: 100%;
            height: 100%;
            --media-accent-color: #3D87FF;
            --media-accent-text-color: #00000C;
            --media-border-radius: 10px;
            --media-scale-unit: 16px;
            --media-object-fit: contain;
        }

        video-skin {
            display: block;
            width: 100%;
            height: 100%;
            aspect-ratio: 16 / 9;
        }

        .shell video {
            width: 100%;
            height: 100%;
            background: #000;
        }

        .loading {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle, rgba(61, 135, 255, .07), transparent 42%),
                linear-gradient(rgba(0, 0, 12, .96), rgba(0, 0, 12, .99));
            transition: opacity .25s ease, visibility .25s ease;
        }

        .loading.gone {
            opacity: 0;
            visibility: hidden;
        }

        .pill {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-radius: 999px;
            background: rgba(1, 1, 22, .76);
            border: 1px solid rgba(93, 157, 255, .16);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            box-shadow: 0 18px 40px rgba(0, 0, 12, .5);
        }

        .ring {
            width: 40px;
            height: 40px;
            flex: none;
            border-radius: 999px;
            border: 2px solid rgba(93, 157, 255, .2);
            border-top-color: var(--accent);
            animation: spin .9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .pill b {
            display: block;
            font-size: .95rem;
            font-weight: 600;
        }

        .pill span {
            display: block;
            font-size: .84rem;
            color: var(--muted);
        }

        h1 {
            font-size: clamp(1.15rem, 2.4vw, 1.5rem);
            font-weight: 800;
            letter-spacing: .01em;
            margin: 1.4rem 0 .4rem;
            overflow-wrap: anywhere;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: .4rem .8rem;
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
            font-size: .78rem;
            color: var(--muted);
        }

        .meta i {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--line-2);
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
            gap: 1rem;
            margin-top: 1.6rem;
            align-items: start;
        }

        .card {
            border: 1px solid rgba(42, 95, 208, .28);
            border-radius: var(--r-md);
            background: rgba(1, 1, 22, .66);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 1.1rem;
        }

        .eyebrow {
            font-family: var(--mono);
            font-size: .66rem;
            font-weight: 600;
            letter-spacing: .24em;
            text-transform: uppercase;
            color: var(--muted);
            margin: 0 0 .8rem;
        }

        .stack {
            display: grid;
            gap: .5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            gap: .6rem;
            min-height: 46px;
            padding: .6rem 1rem;
            border-radius: var(--r-sm);
            border: 1px solid rgba(42, 95, 208, .34);
            background: var(--surface-2);
            color: var(--text);
            font: inherit;
            font-size: .875rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: border-color .18s ease, background .18s ease, transform .18s ease;
        }

        .btn:hover {
            border-color: var(--line-2);
            transform: translateY(-1px);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            flex: none;
        }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #00000C;
            font-weight: 600;
        }

        .btn.primary:hover {
            background: var(--accent-2);
            border-color: var(--accent-2);
        }

        .tabs {
            display: inline-flex;
            gap: .2rem;
            padding: .22rem;
            border: 1px solid rgba(42, 95, 208, .3);
            border-radius: 12px;
            background: var(--surface-2);
            margin-bottom: .8rem;
        }

        .tab {
            appearance: none;
            border: 0;
            background: none;
            color: var(--muted);
            font: inherit;
            font-size: .8rem;
            font-weight: 500;
            padding: .4rem .85rem;
            min-height: 36px;
            border-radius: 9px;
            cursor: pointer;
            transition: background .18s ease, color .18s ease;
        }

        .tab:hover {
            color: var(--text);
        }

        .tab[aria-selected="true"] {
            background: var(--accent);
            color: #00000C;
            font-weight: 600;
        }

        .tab:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .apps {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr));
            gap: .5rem;
        }

        .app {
            display: flex;
            align-items: center;
            gap: .7rem;
            padding: .6rem .75rem;
            border-radius: 12px;
            border: 1px solid rgba(42, 95, 208, .3);
            background: var(--surface-2);
            color: var(--text);
            text-decoration: none;
            font-size: .85rem;
            font-weight: 500;
            min-height: 56px;
            transition: border-color .18s ease, transform .18s ease;
        }

        .app:hover {
            border-color: var(--line-2);
            transform: translateY(-1px);
        }

        .app:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .avatar {
            width: 2rem;
            height: 2rem;
            flex: none;
            display: grid;
            place-items: center;
            border-radius: 9px;
            background: var(--accent-soft);
            color: var(--accent-2);
            font-family: var(--display);
            font-weight: 700;
            font-size: .95rem;
        }

        .app small {
            display: block;
            color: var(--muted);
            font-size: .7rem;
            font-weight: 400;
            line-height: 1.3;
        }

        .notice {
            display: none;
            align-items: flex-start;
            gap: .7rem;
            border: 1px solid rgba(42, 95, 208, .45);
            border-radius: var(--r-md);
            background: rgba(7, 29, 92, .6);
            padding: .85rem 1rem;
            margin-bottom: 1rem;
            font-size: .87rem;
        }

        .notice.show {
            display: flex;
        }

        .notice svg {
            width: 18px;
            height: 18px;
            fill: var(--accent-2);
            flex: none;
            margin-top: .15rem;
        }

        .resume {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: .7rem;
            flex-wrap: wrap;
            border: 1px solid rgba(42, 95, 208, .3);
            border-radius: var(--r-md);
            background: rgba(1, 1, 22, .7);
            padding: .6rem .9rem;
            margin-top: .9rem;
            font-size: .87rem;
        }

        .resume.show {
            display: flex;
        }

        .pair {
            display: flex;
            gap: .4rem;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 1.4rem;
            transform: translate(-50%, 1.5rem);
            background: rgba(1, 1, 22, .95);
            border: 1px solid var(--line-2);
            border-radius: 999px;
            padding: .55rem 1.1rem;
            font-size: .84rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
            z-index: 60;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .err {
            text-align: center;
            padding: 4rem 1rem;
        }

        .err h2 {
            font-family: var(--display);
            font-weight: 700;
            letter-spacing: .02em;
            margin: 0 0 .5rem;
        }

        .err p {
            color: var(--muted);
            margin: 0 0 1.3rem;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: minmax(0, 1fr);
            }

            .glyph {
                font-size: clamp(11rem, 34vmin, 19rem);
            }

            .glyph--w {
                top: 1.2rem;
                left: clamp(.5rem, 6vw, 2.5rem);
                transform: none;
            }

            .glyph--x {
                top: auto;
                bottom: 2.6rem;
                right: clamp(.6rem, 4vw, 2.2rem);
                transform: none;
            }
        }

        @media (max-width: 640px) {
            .page {
                padding-left: .8rem;
                padding-right: .8rem;
            }

            .shell {
                border-radius: 16px;
            }

            video-player {
                --media-scale-unit: 14px;
            }

            .glyph {
                font-size: clamp(9rem, 38vmin, 15rem);
            }

            .now {
                display: none;
            }

            .apps {
                grid-template-columns: repeat(auto-fill, minmax(8rem, 1fr));
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="glyph glyph--w" data-letter="W" aria-hidden="true">W</div>
    <div class="glyph glyph--x" data-letter="X" aria-hidden="true">X</div>

    <header class="topbar">
        <svg viewBox="0 0 100 100" aria-hidden="true">
            <rect width="100" height="100" rx="22.5" fill="#F5F7FF" />
            <path
                d="M 19.4 42.6 C 20.0 55.4 22.4 66.4 29.8 68.3 C 37.0 70.1 43.2 61.0 45.2 48.8 C 47.5 61.0 53.4 66.6 61.0 68.3 C 68.6 70.0 75.6 55.5 80.6 35.3"
                fill="none" stroke="#3D87FF" stroke-width="11.1" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="wordmark"><a href="/">WZML-X</a></span>
        <span class="now" id="now"></span>
    </header>

    <main class="page" id="root">
        <div class="notice rise" id="notice">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2 1 21h22L12 2zm0 6 6.5 11h-13L12 8zm-1 3v4h2v-4h-2zm0 5v2h2v-2h-2z" />
            </svg>
            <div id="noticeText"></div>
        </div>

        <div class="stage rise">
            <div class="shell" id="shell">
                <video-player>
                    <video-skin>
                        <video id="player" playsinline preload="metadata"></video>
                    </video-skin>
                </video-player>
                <div class="loading" id="loading">
                    <div class="pill">
                        <div class="ring"></div>
                        <div>
                            <b>Opening the stream</b>
                            <span id="loadingText">Reaching Telegram…</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="resume" id="resume">
            <span id="resumeText"></span>
            <span class="pair">
                <button class="btn primary" type="button" id="resumeGo">Resume</button>
                <button class="btn" type="button" id="resumeNo">Start over</button>
            </span>
        </div>

        <div class="rise">
            <h1 id="title">Loading…</h1>
            <div class="meta" id="meta"></div>
        </div>

        <div class="grid rise">
            <section class="card">
                <p class="eyebrow">This file</p>
                <div class="stack">
                    <a class="btn primary" id="dl" href="#" download>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 3v10.6l3.3-3.3 1.4 1.4L12 17.4l-4.7-4.7 1.4-1.4 3.3 3.3V3h2zM5 19h14v2H5v-2z" />
                        </svg>
                        Download
                    </a>
                    <button class="btn" type="button" id="copy">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z" />
                        </svg>
                        Copy page link
                    </button>
                    <button class="btn" type="button" id="copyDl">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M3.9 12a3.1 3.1 0 0 1 3.1-3.1h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12zM8 13h8v-2H8v2zm9-6h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10z" />
                        </svg>
                        Copy direct link
                    </button>
                </div>
            </section>

            <section class="card">
                <p class="eyebrow">Open in an app</p>
                <div class="tabs" id="tabs" role="tablist">
                    <button class="tab" type="button" role="tab" data-os="desktop">Desktop</button>
                    <button class="tab" type="button" role="tab" data-os="android">Android</button>
                    <button class="tab" type="button" role="tab" data-os="ios">iOS</button>
                </div>
                <div class="apps" id="ext"></div>
            </section>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script type="module"
        src="https://cdn.jsdelivr.net/npm/@videojs/html@10.0.0-beta.31/cdn/video.js"></script>
    <script>
        (function () {
            "use strict";

            var TOKEN = (location.pathname.split("/").filter(Boolean).pop() || "");
            var STREAM = location.origin + "/stream/" + encodeURIComponent(TOKEN);
            var DIRECT = location.origin + "/dl/" + encodeURIComponent(TOKEN);
            var POS_KEY = "wzx:pos:" + TOKEN;
            var PREF_KEY = "wzx:prefs";

            var el = function (id) { return document.getElementById(id); };
            var vid = el("player");

            function store(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
            function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
            function prefs() { try { return JSON.parse(load(PREF_KEY) || "{}"); } catch (e) { return {}; } }
            function savePrefs(p) { store(PREF_KEY, JSON.stringify(p)); }

            function toast(text) {
                var t = el("toast");
                t.textContent = text;
                t.classList.add("show");
                setTimeout(function () { t.classList.remove("show"); }, 1800);
            }

            function bytes(n) {
                if (!n) return "unknown size";
                var u = ["B", "KB", "MB", "GB", "TB"], i = 0, v = n;
                while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
                return (i === 0 ? v : v.toFixed(v < 10 ? 2 : 1)) + " " + u[i];
            }

            function clock(s) {
                if (!isFinite(s) || s <= 0) return "";
                s = Math.floor(s);
                var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), q = s % 60;
                var pad = function (x) { return x < 10 ? "0" + x : "" + x; };
                return (h ? h + ":" + pad(m) : "" + m) + ":" + pad(q);
            }

            function notice(html) {
                el("noticeText").innerHTML = html;
                el("notice").classList.add("show");
            }

            function fatal(head, body) {
                el("root").innerHTML = '<div class="err"><h2></h2><p></p>' +
                    '<p><a class="btn primary" href="/">Back to WZML-X</a></p></div>';
                el("root").querySelector("h2").textContent = head;
                el("root").querySelector("p").textContent = body;
            }

            function detectOS() {
                var ua = navigator.userAgent || "";
                if (/android/i.test(ua)) return "android";
                if (/iPad|iPhone|iPod/.test(ua)) return "ios";
                if (/Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1) return "ios";
                return "desktop";
            }

            function m3u(name) {
                var text = "#EXTM3U\n#EXTINF:-1," + (name || "Video") + "\n" + STREAM + "\n";
                return "data:audio/x-mpegurl;charset=utf-8," + encodeURIComponent(text);
            }

            function intent(pkg, name) {
                return "intent:" + STREAM + "#Intent;package=" + pkg +
                    ";type=video/*;S.title=" + encodeURIComponent(name || "Video") + ";end";
            }

            function extApps(os, name) {
                var enc = encodeURIComponent(STREAM);
                if (os === "android") {
                    return [
                        ["V", "VLC", "Android", intent("org.videolan.vlc", name)],
                        ["N", "nPlayer", "Android", intent("com.newin.nplayer.pro", name)],
                        ["M", "MX Player", "Android", intent("com.mxtech.videoplayer.ad", name)]
                    ];
                }
                if (os === "ios") {
                    return [
                        ["I", "Infuse", "iOS / iPadOS", "infuse://x-callback-url/play?url=" + enc],
                        ["V", "VLC", "iOS / iPadOS", "vlc-x-callback://x-callback-url/stream?url=" + enc],
                        ["N", "nPlayer", "iOS / iPadOS", "nplayer-" + STREAM]
                    ];
                }
                return [
                    ["I", "IINA", "macOS", "iina://weblink?url=" + enc],
                    ["V", "VLC", "Playlist file", m3u(name)],
                    ["N", "nPlayer", "macOS", "nplayer-" + STREAM]
                ];
            }

            function buildExt(os, name) {
                var box = el("ext");
                box.innerHTML = "";
                extApps(os, name).forEach(function (app) {
                    var a = document.createElement("a");
                    a.className = "app";
                    a.href = app[3];
                    a.rel = "noopener";
                    if (app[1] === "VLC" && os === "desktop") {
                        a.setAttribute("download", (name || "video") + ".m3u");
                    }
                    var av = document.createElement("span");
                    av.className = "avatar";
                    av.textContent = app[0];
                    var tx = document.createElement("span");
                    tx.textContent = app[1];
                    var sm = document.createElement("small");
                    sm.textContent = app[2];
                    tx.appendChild(sm);
                    a.appendChild(av);
                    a.appendChild(tx);
                    box.appendChild(a);
                });
            }

            function wireTabs(name) {
                var tabs = Array.prototype.slice.call(el("tabs").querySelectorAll(".tab"));
                function pick(os) {
                    tabs.forEach(function (t) {
                        t.setAttribute("aria-selected", t.dataset.os === os ? "true" : "false");
                    });
                    buildExt(os, name);
                }
                tabs.forEach(function (t) { t.onclick = function () { pick(t.dataset.os); }; });
                pick(detectOS());
            }

            function wireResume() {
                var saved = parseFloat(load(POS_KEY) || "0");
                var dur = vid.duration;
                if (saved > 30 && isFinite(dur) && saved < dur - 30) {
                    el("resumeText").textContent = "You stopped at " + clock(saved) + ".";
                    el("resume").classList.add("show");
                    el("resumeGo").onclick = function () {
                        vid.currentTime = saved;
                        el("resume").classList.remove("show");
                        vid.play();
                    };
                    el("resumeNo").onclick = function () {
                        store(POS_KEY, "0");
                        el("resume").classList.remove("show");
                    };
                }
                var last = 0;
                vid.addEventListener("timeupdate", function () {
                    var now = vid.currentTime;
                    if (Math.abs(now - last) < 5) return;
                    last = now;
                    store(POS_KEY, String(now));
                });
                vid.addEventListener("ended", function () { store(POS_KEY, "0"); });
            }

            function addMeta(text) {
                var box = el("meta");
                if (box.children.length) box.appendChild(document.createElement("i"));
                var s = document.createElement("span");
                s.textContent = text;
                box.appendChild(s);
            }

            function start(info) {
                var name = info.name || "Untitled";
                document.title = name + " — WZML-X";
                el("title").textContent = name;
                el("now").textContent = name;
                el("dl").href = DIRECT;
                el("dl").setAttribute("download", name);
                wireTabs(name);
                addMeta(bytes(info.size));
                if (info.mime) addMeta(info.mime);

                var p = prefs();
                if (typeof p.volume === "number") vid.volume = p.volume;
                if (p.muted) vid.muted = true;
                if (typeof p.rate === "number" && p.rate > 0) vid.playbackRate = p.rate;

                vid.addEventListener("volumechange", function () {
                    var q = prefs();
                    q.volume = vid.volume;
                    q.muted = vid.muted;
                    savePrefs(q);
                });
                vid.addEventListener("ratechange", function () {
                    var q = prefs();
                    q.rate = vid.playbackRate;
                    savePrefs(q);
                });

                vid.addEventListener("loadedmetadata", function () {
                    el("loading").classList.add("gone");
                    if (isFinite(vid.duration) && vid.duration > 0) addMeta(clock(vid.duration));
                    wireResume();
                });

                vid.addEventListener("error", function () {
                    el("loading").classList.add("gone");
                    var e = vid.error;
                    if (e && e.code === 4) {
                        el("shell").classList.add("dead");
                        notice("<b>This browser cannot decode this file.</b> " +
                            (info.mime || "The container or codec") +
                            " is not supported here. Open it in an app below, or download it.");
                    } else {
                        notice("<b>Playback stopped.</b> The connection dropped or the link " +
                            "expired. Reload the page, or open it in an app below.");
                    }
                });

                if (info.mime) vid.setAttribute("type", info.mime);
                vid.src = STREAM;

                setTimeout(function () {
                    if (!el("loading").classList.contains("gone")) {
                        el("loadingText").textContent = "Still buffering — large files take a moment.";
                    }
                }, 6000);
            }

            el("copy").onclick = function () {
                navigator.clipboard.writeText(location.href).then(
                    function () { toast("Page link copied"); },
                    function () { toast("Copy failed"); });
            };
            el("copyDl").onclick = function () {
                navigator.clipboard.writeText(DIRECT).then(
                    function () { toast("Direct link copied"); },
                    function () { toast("Copy failed"); });
            };

            if (!TOKEN) {
                fatal("Nothing to play", "This link is missing its file reference.");
                return;
            }

            fetch("/api/stream/" + encodeURIComponent(TOKEN), { cache: "no-store" })
                .then(function (r) {
                    if (r.status === 404) throw new Error("gone");
                    if (!r.ok) throw new Error("bad");
                    return r.json();
                })
                .then(start)
                .catch(function (e) {
                    if (e && e.message === "gone") {
                        fatal("This file is no longer available",
                            "It was removed from the source chat, or the link is wrong.");
                    } else {
                        fatal("Could not load this file",
                            "The streaming service did not respond. Try again shortly.");
                    }
                });
        })();
    </script>
</body>

</html>
