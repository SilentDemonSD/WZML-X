<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#00000C">
    <title>Stream — WZML-X</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22.5' fill='%23F5F7FF'/%3E%3Cpath d='M 19.4 42.6 C 20.0 55.4 22.4 66.4 29.8 68.3 C 37.0 70.1 43.2 61.0 45.2 48.8 C 47.5 61.0 53.4 66.6 61.0 68.3 C 68.6 70.0 75.6 55.5 80.6 35.3' fill='none' stroke='%233D87FF' stroke-width='11.1' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Tektur:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        @property --ang {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        :root {
            color-scheme: dark;
            --bg: #00000C;
            --surface: #010116;
            --surface-2: #02021F;
            --line: rgba(42, 95, 208, .3);
            --line-2: #2A5FD0;
            --text: #F5F7FF;
            --muted: #CBD2E5;
            --accent: #3D87FF;
            --accent-2: #5B9DFF;
            --accent-soft: #071D5C;
            --r: 12px;
            --r-frame: 20px;
            --sans: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --display: 'Tektur', 'Montserrat', system-ui, sans-serif;
            --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 16px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
            scrollbar-width: thin;
            scrollbar-color: rgba(42, 95, 208, .5) transparent;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(42, 95, 208, .45);
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--line-2);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: .5;
            transition: opacity .45s ease;
            background:
                linear-gradient(rgba(42, 95, 208, .16) 1px, transparent 1px) 50% / 12px 12px,
                linear-gradient(90deg, rgba(42, 95, 208, .16) 1px, transparent 1px) 50% / 12px 12px,
                radial-gradient(circle at 50% 16%, rgba(61, 135, 255, .13), transparent 26%),
                radial-gradient(circle at 50% 92%, rgba(7, 29, 92, .5), transparent 42%);
        }

        .glyph {
            position: fixed;
            z-index: 0;
            font-family: var(--display);
            font-size: clamp(12rem, 24vw, 26rem);
            font-weight: 600;
            line-height: .8;
            letter-spacing: -.08em;
            color: #080f26;
            filter: drop-shadow(0 0 42px rgba(0, 0, 12, .9));
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
            transition: opacity .45s ease;
            animation: fade 1.2s cubic-bezier(.16, 1, .3, 1) both;
        }

        .glyph::before {
            content: attr(data-letter);
            position: absolute;
            inset: 0;
            color: transparent;
            background:
                radial-gradient(circle at 40% 25%, rgba(93, 157, 255, .34), transparent 34%),
                radial-gradient(circle at 60% 75%, rgba(61, 135, 255, .13), transparent 36%),
                linear-gradient(rgba(245, 247, 255, .16), rgba(245, 247, 255, .04));
            -webkit-background-clip: text;
            background-clip: text;
            filter: blur(22px);
            opacity: .9;
            transform: scale(1.06);
        }

        .glyph::after {
            content: attr(data-letter);
            position: absolute;
            inset: 0;
            color: rgba(203, 210, 229, .13);
            text-shadow: 0 0 18px rgba(93, 157, 255, .12), 0 0 60px rgba(0, 0, 12, .92);
            transform: scale(1.01);
        }

        .glyph--w {
            top: 50%;
            left: clamp(.25rem, 1.5vw, 1.75rem);
            transform: translateY(-50%) scaleX(.92);
        }

        .glyph--x {
            top: 50%;
            right: clamp(1rem, 3vw, 3rem);
            transform: translateY(-50%) scaleX(.92);
        }

        @keyframes fade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .topwrap {
            position: sticky;
            top: 0;
            z-index: 30;
            padding: clamp(.6rem, 1.5vw, .9rem) clamp(.7rem, 2.5vw, 1.75rem) 0;
            transition: opacity .45s ease;
        }

        .topbar {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: .65rem;
            height: 58px;
            padding: 0 1rem;
            border-radius: 16px;
            border: 1px solid rgba(93, 157, 255, .22);
            background: rgba(1, 1, 22, .82);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            box-shadow:
                0 10px 34px rgba(0, 0, 12, .62),
                inset 0 1px rgba(245, 247, 255, .07);
        }

        .mark {
            width: 26px;
            height: 26px;
            flex: none;
            border-radius: 7px;
            outline: 1px solid rgba(93, 157, 255, .35);
            outline-offset: 1px;
        }

        .wordmark {
            font-family: var(--display);
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: .07em;
        }

        .wordmark a {
            color: var(--text);
            text-decoration: none;
        }

        .now {
            margin-left: auto;
            font-family: var(--mono);
            font-size: .74rem;
            letter-spacing: .06em;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 46%;
        }

        .page {
            position: relative;
            z-index: 1;
            max-width: 1320px;
            margin: 0 auto;
            padding: clamp(.9rem, 2vw, 1.4rem) clamp(.7rem, 2.5vw, 1.75rem) 3rem;
        }

        .rise {
            animation: rise .5s cubic-bezier(.16, 1, .3, 1) both;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: none; }
        }

        .stage {
            display: flex;
            justify-content: center;
        }

        .frame {
            position: relative;
            z-index: 2;
            width: min(1240px, 100%);
        }

        .frame::before {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: calc(var(--r-frame) + 4px);
            background: conic-gradient(from var(--ang),
                    #3D87FF, #22D3EE, #7C5CFF, #F5F7FF, #3D87FF);
            filter: blur(22px);
            opacity: 0;
            transition: opacity .4s ease;
            pointer-events: none;
        }

        .frame:hover::before,
        .frame:focus-within::before,
        body.lightsoff .frame::before {
            opacity: .68;
            animation: hue 7s linear infinite;
        }

        @keyframes hue {
            to { --ang: 360deg; }
        }

        .shell {
            position: relative;
            aspect-ratio: 16 / 9;
            border-radius: var(--r-frame);
            overflow: hidden;
            background: #000208;
            box-shadow:
                0 24px 80px rgba(0, 0, 12, .78),
                0 0 0 1px rgba(42, 95, 208, .34);
        }

        .frame.dead {
            display: none;
        }

        .fill {
            position: absolute;
            inset: 0;
        }

        video-player,
        video-minimal-skin {
            display: block;
            width: 100%;
            height: 100%;
        }

        .shell video {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
        }

        video-player {
            --media-accent-color: #3D87FF;
            --media-accent-text-color: #00000C;
            --media-border-radius: 8px;
            --media-scale-unit: 16px;
            --media-object-fit: contain;
        }

        .dimmer {
            position: fixed;
            inset: 0;
            z-index: 1;
            background: rgba(0, 0, 6, .92);
            opacity: 0;
            visibility: hidden;
            transition: opacity .45s ease, visibility .45s ease;
        }

        body.lightsoff .dimmer {
            opacity: 1;
            visibility: visible;
        }

        body.lightsoff .glyph,
        body.lightsoff .topwrap,
        body.lightsoff .below {
            opacity: .06;
            pointer-events: none;
        }

        body.lightsoff body::before {
            opacity: 0;
        }

        .below {
            transition: opacity .45s ease;
        }

        .loading {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: grid;
            place-items: center;
            background: linear-gradient(rgba(0, 0, 12, .96), rgba(0, 0, 12, .99));
            transition: opacity .25s ease, visibility .25s ease;
        }

        .loading.gone {
            opacity: 0;
            visibility: hidden;
        }

        .load-copy {
            text-align: center;
            max-width: 22rem;
            padding: 0 1rem;
        }

        .load-copy b {
            display: block;
            font-family: var(--display);
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: .04em;
        }

        .load-copy span {
            display: block;
            margin-top: .3rem;
            font-size: .85rem;
            color: var(--muted);
        }

        .bar {
            height: 2px;
            width: 9rem;
            margin: .9rem auto 0;
            border-radius: 2px;
            background: rgba(93, 157, 255, .18);
            overflow: hidden;
        }

        .bar::after {
            content: "";
            display: block;
            width: 40%;
            height: 100%;
            border-radius: 2px;
            background: var(--accent);
            animation: sweep 1.4s ease-in-out infinite;
        }

        @keyframes sweep {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }

        .head {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin-top: 1.2rem;
            flex-wrap: wrap;
        }

        .txt {
            min-width: 0;
            flex: 1 1 20rem;
        }

        h1 {
            font-size: clamp(1.1rem, 1.6vw, 1.35rem);
            font-weight: 700;
            letter-spacing: .005em;
            margin: 0 0 .35rem;
            overflow-wrap: anywhere;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: .35rem .75rem;
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
            font-size: .78rem;
            color: var(--muted);
        }

        .meta i {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--line-2);
        }

        .acts {
            display: flex;
            gap: .35rem;
            flex: 0 0 auto;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .45rem;
            height: 36px;
            padding: 0 .8rem;
            border-radius: var(--r);
            border: 1px solid var(--line);
            background: var(--surface-2);
            color: var(--text);
            font: inherit;
            font-size: .8rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
            transition: border-color .16s ease, background .16s ease, transform .12s ease;
        }

        .btn:hover {
            border-color: var(--line-2);
            background: var(--accent-soft);
        }

        .btn:active {
            transform: scale(.97);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
            flex: none;
        }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #00000C;
            font-weight: 600;
        }

        .btn.primary:hover {
            background: var(--accent-2);
            border-color: var(--accent-2);
        }

        .btn.icon {
            width: 36px;
            padding: 0;
        }

        .btn.on {
            border-color: var(--accent);
            color: var(--accent-2);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: .4rem .5rem;
            margin-top: 1rem;
            padding-top: .9rem;
            border-top: 1px solid var(--line);
        }

        .spacer {
            flex: 1 1 auto;
        }

        .dd {
            position: relative;
            display: none;
        }

        .dd.show {
            display: block;
        }

        .dd-btn {
            display: inline-flex;
            align-items: center;
            gap: .45rem;
            height: 36px;
            padding: 0 .7rem;
            border-radius: var(--r);
            border: 1px solid var(--line);
            background: var(--surface-2);
            color: var(--text);
            font: inherit;
            font-size: .8rem;
            font-weight: 500;
            cursor: pointer;
            max-width: 15rem;
            transition: border-color .16s ease, background .16s ease;
        }

        .dd-btn:hover {
            border-color: var(--line-2);
            background: var(--accent-soft);
        }

        .dd-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .dd-btn em {
            font-family: var(--mono);
            font-style: normal;
            font-size: .64rem;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .dd-btn b {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .dd-btn svg {
            width: 12px;
            height: 12px;
            fill: var(--muted);
            flex: none;
            margin-left: auto;
            transition: transform .18s ease;
        }

        .dd.open .dd-btn svg {
            transform: rotate(180deg);
        }

        .dd-panel {
            position: absolute;
            bottom: calc(100% + 6px);
            left: 0;
            min-width: 100%;
            width: max-content;
            max-width: min(22rem, 88vw);
            max-height: 19rem;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: .3rem;
            border-radius: var(--r);
            border: 1px solid rgba(93, 157, 255, .3);
            background: rgba(1, 1, 22, .97);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 18px 50px rgba(0, 0, 12, .8);
            display: none;
            z-index: 40;
        }

        .dd.up .dd-panel {
            bottom: auto;
            top: calc(100% + 6px);
        }

        .dd.right .dd-panel {
            left: auto;
            right: 0;
        }

        .dd.open .dd-panel {
            display: block;
        }

        .dd-group {
            font-family: var(--mono);
            font-size: .6rem;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--muted);
            padding: .5rem .55rem .3rem;
        }

        .dd-item {
            display: flex;
            align-items: center;
            gap: .5rem;
            width: 100%;
            padding: .45rem .55rem;
            border: 0;
            border-radius: 8px;
            background: none;
            color: var(--text);
            font: inherit;
            font-size: .8rem;
            text-align: left;
            cursor: pointer;
            transition: background .12s ease;
        }

        .dd-item:hover,
        .dd-item:focus-visible {
            background: var(--accent-soft);
            outline: none;
        }

        .dd-item[aria-selected="true"] {
            color: var(--accent-2);
        }

        .dd-item[aria-selected="true"]::after {
            content: "";
            width: 6px;
            height: 6px;
            margin-left: auto;
            border-radius: 50%;
            background: var(--accent);
            flex: none;
        }

        .notice {
            display: none;
            align-items: flex-start;
            gap: .6rem;
            border: 1px solid rgba(42, 95, 208, .45);
            border-radius: var(--r);
            background: rgba(7, 29, 92, .6);
            padding: .75rem .9rem;
            margin-bottom: .9rem;
            font-size: .86rem;
        }

        .notice.show {
            display: flex;
        }

        .notice svg {
            width: 17px;
            height: 17px;
            fill: var(--accent-2);
            flex: none;
            margin-top: .15rem;
        }

        .resume {
            display: none;
            align-items: center;
            gap: .5rem;
            flex-wrap: wrap;
            margin-top: .9rem;
            font-size: .84rem;
            color: var(--muted);
        }

        .resume.show {
            display: flex;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 1.3rem;
            transform: translate(-50%, 1.5rem);
            background: rgba(1, 1, 22, .95);
            border: 1px solid var(--line-2);
            border-radius: 999px;
            padding: .45rem 1rem;
            font-size: .82rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
            z-index: 70;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .err {
            text-align: center;
            padding: 4rem 1rem;
        }

        .err h2 {
            font-family: var(--display);
            font-weight: 700;
            letter-spacing: .02em;
            margin: 0 0 .5rem;
        }

        .err p {
            color: var(--muted);
            margin: 0 0 1.3rem;
        }

        @media (max-width: 900px) {
            .glyph {
                font-size: clamp(11rem, 34vmin, 19rem);
            }

            .glyph--w {
                top: .8rem;
                left: clamp(.5rem, 6vw, 2.5rem);
                transform: none;
            }

            .glyph--x {
                top: auto;
                bottom: 2.2rem;
                right: clamp(.6rem, 4vw, 2.2rem);
                transform: none;
            }
        }

        @media (max-width: 640px) {
            body {
                font-size: 15px;
            }

            .topwrap {
                position: relative;
            }

            .topbar {
                height: 52px;
            }

            .page {
                padding-left: .6rem;
                padding-right: .6rem;
            }

            .stage {
                min-height: calc(100dvh - 8.5rem);
                align-items: center;
            }

            .shell {
                border-radius: 14px;
            }

            video-player {
                --media-scale-unit: 14px;
            }

            .glyph {
                font-size: clamp(9rem, 38vmin, 15rem);
            }

            .now {
                display: none;
            }

            .acts {
                width: 100%;
            }

            .acts .btn:first-child {
                flex: 1 1 auto;
            }

            .dd-btn {
                max-width: none;
            }

            .dd {
                flex: 1 1 9rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="glyph glyph--w" data-letter="W" aria-hidden="true">W</div>
    <div class="glyph glyph--x" data-letter="X" aria-hidden="true">X</div>
    <div class="dimmer" id="dimmer"></div>

    <div class="topwrap">
        <header class="topbar">
            <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
                <rect width="100" height="100" rx="22.5" fill="#F5F7FF" />
                <path
                    d="M 19.4 42.6 C 20.0 55.4 22.4 66.4 29.8 68.3 C 37.0 70.1 43.2 61.0 45.2 48.8 C 47.5 61.0 53.4 66.6 61.0 68.3 C 68.6 70.0 75.6 55.5 80.6 35.3"
                    fill="none" stroke="#3D87FF" stroke-width="11.1" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="wordmark"><a href="/">WZML-X</a></span>
            <span class="now" id="now"></span>
        </header>
    </div>

    <main class="page" id="root">
        <div class="notice below" id="notice">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2 1 21h22L12 2zm0 6 6.5 11h-13L12 8zm-1 3v4h2v-4h-2zm0 5v2h2v-2h-2z" />
            </svg>
            <div id="noticeText"></div>
        </div>

        <div class="stage rise">
            <div class="frame" id="frame">
                <div class="shell">
                    <div class="fill">
                        <video-player>
                            <video-minimal-skin>
                                <video id="player" playsinline webkit-playsinline preload="metadata"></video>
                            </video-minimal-skin>
                        </video-player>
                    </div>
                    <div class="loading" id="loading">
                        <div class="load-copy">
                            <b>Opening the stream</b>
                            <span id="loadingText">Reaching Telegram</span>
                            <div class="bar"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="below">
            <div class="head">
                <div class="txt">
                    <h1 id="title">Loading…</h1>
                    <div class="meta" id="meta"></div>
                </div>
                <div class="acts">
                    <a class="btn primary" id="dl" href="#" download>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 3v10.6l3.3-3.3 1.4 1.4L12 17.4l-4.7-4.7 1.4-1.4 3.3 3.3V3h2zM5 19h14v2H5v-2z" />
                        </svg>
                        Download
                    </a>
                    <button class="btn icon" type="button" id="lights" title="Lights off"
                        aria-label="Lights off" aria-pressed="false">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M12 2a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2zm-3 18h6v1a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-1z" />
                        </svg>
                    </button>
                    <button class="btn icon" type="button" id="copy" title="Copy page link"
                        aria-label="Copy page link">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z" />
                        </svg>
                    </button>
                    <button class="btn icon" type="button" id="copyDl" title="Copy direct link"
                        aria-label="Copy direct link">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M3.9 12a3.1 3.1 0 0 1 3.1-3.1h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12zM8 13h8v-2H8v2zm9-6h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="resume" id="resume">
                <span id="resumeText"></span>
                <button class="btn" type="button" id="resumeGo">Resume</button>
                <button class="btn" type="button" id="resumeNo">Start over</button>
            </div>

            <div class="controls">
                <div class="dd" id="audDd"></div>
                <div class="dd" id="subDd"></div>
                <div class="spacer"></div>
                <div class="dd show" id="appDd"></div>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script type="module"
        src="https://cdn.jsdelivr.net/npm/@videojs/html@10.0.0-beta.31/cdn/video-minimal.js"></script>
    <script>
        (function () {
            "use strict";

            var TOKEN = (location.pathname.split("/").filter(Boolean).pop() || "");
            var STREAM = location.origin + "/stream/" + encodeURIComponent(TOKEN);
            var DIRECT = location.origin + "/dl/" + encodeURIComponent(TOKEN);
            var POS_KEY = "wzx:pos:" + TOKEN;
            var PREF_KEY = "wzx:prefs";

            var el = function (id) { return document.getElementById(id); };
            var vid = el("player");
            var FILE = "Video";
            var MIME = "";
            var probed = null;

            function store(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
            function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
            function prefs() { try { return JSON.parse(load(PREF_KEY) || "{}"); } catch (e) { return {}; } }
            function savePrefs(p) { store(PREF_KEY, JSON.stringify(p)); }

            function toast(text) {
                var t = el("toast");
                t.textContent = text;
                t.classList.add("show");
                setTimeout(function () { t.classList.remove("show"); }, 1900);
            }

            function bytes(n) {
                if (!n) return "unknown size";
                var u = ["B", "KB", "MB", "GB", "TB"], i = 0, v = n;
                while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
                return (i === 0 ? v : v.toFixed(v < 10 ? 2 : 1)) + " " + u[i];
            }

            function clock(s) {
                if (!isFinite(s) || s <= 0) return "";
                s = Math.floor(s);
                var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), q = s % 60;
                var pad = function (x) { return x < 10 ? "0" + x : "" + x; };
                return (h ? h + ":" + pad(m) : "" + m) + ":" + pad(q);
            }

            function notice(html) {
                el("noticeText").innerHTML = html;
                el("notice").classList.add("show");
            }

            function fatal(head, body) {
                el("root").innerHTML = '<div class="err"><h2></h2><p></p>' +
                    '<p><a class="btn primary" href="/">Back to WZML-X</a></p></div>';
                el("root").querySelector("h2").textContent = head;
                el("root").querySelector("p").textContent = body;
            }

            function detectOS() {
                var ua = navigator.userAgent || "";
                if (/android/i.test(ua)) return "android";
                if (/iPad|iPhone|iPod/.test(ua)) return "ios";
                if (/Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1) return "ios";
                if (/Macintosh|Mac OS X/.test(ua)) return "mac";
                return "desktop";
            }

            var CHEV = '<svg viewBox="0 0 24 24" aria-hidden="true">' +
                '<path d="M7 10l5 5 5-5z"/></svg>';

            function dropdown(host, label, groups, current, onPick, alignRight) {
                host.innerHTML = "";
                host.classList.add("show");
                if (alignRight) host.classList.add("right");

                var btn = document.createElement("button");
                btn.type = "button";
                btn.className = "dd-btn";
                btn.setAttribute("aria-haspopup", "listbox");
                btn.setAttribute("aria-expanded", "false");
                var lab = document.createElement("em");
                lab.textContent = label;
                var val = document.createElement("b");
                btn.appendChild(lab);
                btn.appendChild(val);
                btn.insertAdjacentHTML("beforeend", CHEV);

                var panel = document.createElement("div");
                panel.className = "dd-panel";
                panel.setAttribute("role", "listbox");

                function setLabel(text) { val.textContent = text; }

                groups.forEach(function (g) {
                    if (g.label) {
                        var h = document.createElement("div");
                        h.className = "dd-group";
                        h.textContent = g.label;
                        panel.appendChild(h);
                    }
                    g.items.forEach(function (it) {
                        var b = document.createElement("button");
                        b.type = "button";
                        b.className = "dd-item";
                        b.setAttribute("role", "option");
                        b.textContent = it.label;
                        if (it.value === current) {
                            b.setAttribute("aria-selected", "true");
                            setLabel(it.label);
                        }
                        b.onclick = function () {
                            close();
                            panel.querySelectorAll('[aria-selected="true"]').forEach(
                                function (n) { n.removeAttribute("aria-selected"); });
                            if (it.sticky !== false) {
                                b.setAttribute("aria-selected", "true");
                                setLabel(it.label);
                            }
                            onPick(it);
                        };
                        panel.appendChild(b);
                    });
                });

                if (!val.textContent) setLabel(groups[0] && groups[0].items[0]
                    ? groups[0].items[0].label : "Choose");

                function open() {
                    host.classList.add("open");
                    btn.setAttribute("aria-expanded", "true");
                    host.classList.toggle("up",
                        host.getBoundingClientRect().top < 320);
                    document.addEventListener("pointerdown", away, true);
                    document.addEventListener("keydown", esc, true);
                }
                function close() {
                    host.classList.remove("open");
                    btn.setAttribute("aria-expanded", "false");
                    document.removeEventListener("pointerdown", away, true);
                    document.removeEventListener("keydown", esc, true);
                }
                function away(e) { if (!host.contains(e.target)) close(); }
                function esc(e) { if (e.key === "Escape") { close(); btn.focus(); } }

                btn.onclick = function () {
                    if (host.classList.contains("open")) close(); else open();
                };

                host.appendChild(btn);
                host.appendChild(panel);
                return { setLabel: setLabel };
            }

            function m3u() {
                var text = "#EXTM3U\n#EXTINF:-1," + FILE + "\n" + STREAM + "\n";
                return "data:audio/x-mpegurl;charset=utf-8," + encodeURIComponent(text);
            }

            function intent(pkg) {
                return "intent:" + STREAM + "#Intent;package=" + pkg +
                    ";type=video/*;S.title=" + encodeURIComponent(FILE) + ";end";
            }

            function catalogue() {
                var enc = encodeURIComponent(STREAM);
                return {
                    android: [
                        ["VLC", intent("org.videolan.vlc")],
                        ["MX Player", intent("com.mxtech.videoplayer.ad")],
                        ["MX Player Pro", intent("com.mxtech.videoplayer.pro")],
                        ["nPlayer", intent("com.newin.nplayer.pro")],
                        ["Just Player", intent("com.brouken.player")],
                        ["Kodi", intent("org.xbmc.kodi")],
                        ["Web Video Cast", intent("com.instantbits.cast.webvideo")],
                        ["Any player", "intent:" + STREAM + "#Intent;type=video/*;end"]
                    ],
                    ios: [
                        ["Infuse", "infuse://x-callback-url/play?url=" + enc],
                        ["VLC", "vlc-x-callback://x-callback-url/stream?url=" + enc],
                        ["nPlayer", "nplayer-" + STREAM],
                        ["Outplayer", "outplayer://" + STREAM],
                        ["SenPlayer", "senplayer://x-callback-url/play?url=" + enc],
                        ["VidHub", "open-vidhub://x-callback-url/open?url=" + enc],
                        ["KMPlayer", "kmplayer://" + STREAM],
                        ["PlayerXtreme", "playerxtreme://" + STREAM]
                    ],
                    mac: [
                        ["IINA", "iina://weblink?url=" + enc],
                        ["VLC", "vlc://" + STREAM],
                        ["Infuse", "infuse://x-callback-url/play?url=" + enc],
                        ["nPlayer", "nplayer-" + STREAM],
                        ["VidHub", "open-vidhub://x-callback-url/open?url=" + enc],
                        ["Playlist file", m3u()]
                    ],
                    desktop: [
                        ["VLC", "vlc://" + STREAM],
                        ["PotPlayer", "potplayer://" + STREAM],
                        ["MPC-HC", "mpc-hc://" + STREAM],
                        ["Kodi", "kodi://" + STREAM],
                        ["Playlist file", m3u()]
                    ]
                };
            }

            var OS_LABEL = {
                android: "Android",
                ios: "iOS / iPadOS",
                mac: "macOS",
                desktop: "Windows / Linux"
            };

            function buildApps() {
                var cat = catalogue();
                var here = detectOS();
                var order = [here].concat(["android", "ios", "mac", "desktop"].filter(
                    function (k) { return k !== here; }));
                var groups = order.map(function (k) {
                    return {
                        label: OS_LABEL[k],
                        items: cat[k].map(function (p) {
                            return { label: p[0], value: p[1], file: p[0] === "Playlist file",
                                sticky: false };
                        })
                    };
                });
                dropdown(el("appDd"), "Open in", groups, null, function (it) {
                    if (it.file) {
                        var a = document.createElement("a");
                        a.href = it.value;
                        a.download = FILE + ".m3u";
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                    } else {
                        window.location.href = it.value;
                    }
                }, true);
                el("appDd").querySelector(".dd-btn b").textContent = "an app";
            }

            function applyTracks(info) {
                var auds = (info && info.audio) || [];
                var subs = (info && info.subtitle) || [];

                if (auds.length > 1) {
                    dropdown(el("audDd"), "Audio",
                        [{ items: auds.map(function (t) {
                            return { label: t.title, value: String(t.index) };
                        }) }],
                        String(auds[0].index),
                        function (it) {
                            var at = Math.max(0, vid.currentTime || 0);
                            var was = !vid.paused;
                            vid.src = STREAM + "?a=" + encodeURIComponent(it.value);
                            vid.addEventListener("loadedmetadata", function once() {
                                vid.removeEventListener("loadedmetadata", once);
                                try { vid.currentTime = at; } catch (e) { }
                                if (was) vid.play();
                            });
                            toast("Switched audio track");
                        });
                }

                if (subs.length) {
                    var items = [{ label: "Off", value: "-1" }].concat(
                        subs.map(function (t) {
                            return { label: t.title, value: String(t.index) };
                        }));
                    dropdown(el("subDd"), "Subtitles", [{ items: items }], "-1",
                        function (it) {
                            Array.prototype.slice.call(
                                vid.querySelectorAll("track")).forEach(function (n) {
                                    n.remove();
                                });
                            for (var i = 0; i < vid.textTracks.length; i++) {
                                vid.textTracks[i].mode = "disabled";
                            }
                            if (it.value === "-1") return;
                            var tr = document.createElement("track");
                            tr.kind = "subtitles";
                            tr.label = it.label;
                            tr.src = location.origin + "/subs/" +
                                encodeURIComponent(TOKEN) + "/" +
                                encodeURIComponent(it.value) + ".vtt";
                            tr.default = true;
                            vid.appendChild(tr);
                            tr.addEventListener("load", function () {
                                if (tr.track) tr.track.mode = "showing";
                            });
                            tr.addEventListener("error", function () {
                                toast("Could not load that subtitle track");
                            });
                        });
                }
            }

            function loadTracks() {
                fetch("/api/tracks/" + encodeURIComponent(TOKEN), { cache: "no-store" })
                    .then(function (r) { return r.ok ? r.json() : null; })
                    .then(function (t) {
                        if (!t) return;
                        probed = t;
                        applyTracks(t);
                    })
                    .catch(function () { });
            }

            function wireResume() {
                var saved = parseFloat(load(POS_KEY) || "0");
                var dur = vid.duration;
                if (saved > 30 && isFinite(dur) && saved < dur - 30) {
                    el("resumeText").textContent = "Stopped at " + clock(saved);
                    el("resume").classList.add("show");
                    el("resumeGo").onclick = function () {
                        vid.currentTime = saved;
                        el("resume").classList.remove("show");
                        vid.play();
                    };
                    el("resumeNo").onclick = function () {
                        store(POS_KEY, "0");
                        el("resume").classList.remove("show");
                    };
                }
                var last = 0;
                vid.addEventListener("timeupdate", function () {
                    var now = vid.currentTime;
                    if (Math.abs(now - last) < 5) return;
                    last = now;
                    store(POS_KEY, String(now));
                });
                vid.addEventListener("ended", function () { store(POS_KEY, "0"); });
            }

            function addMeta(text) {
                var box = el("meta");
                if (box.children.length) box.appendChild(document.createElement("i"));
                var s = document.createElement("span");
                s.textContent = text;
                box.appendChild(s);
            }

            function noVideoTrack() {
                notice("<b>Your browser played the audio but could not decode the " +
                    "picture.</b> That usually means the video codec is not supported " +
                    "here — 10-bit H.264 and HEVC are the common cases on phones. " +
                    "Open it in an app below, or download it.");
            }

            function start(info) {
                FILE = info.name || "Untitled";
                MIME = info.mime || "";
                document.title = FILE + " — WZML-X";
                el("title").textContent = FILE;
                el("now").textContent = FILE;
                el("dl").href = DIRECT;
                el("dl").setAttribute("download", FILE);
                buildApps();
                loadTracks();
                addMeta(bytes(info.size));
                if (MIME) addMeta(MIME);

                var p = prefs();
                if (typeof p.volume === "number") vid.volume = p.volume;
                if (p.muted) vid.muted = true;
                if (typeof p.rate === "number" && p.rate > 0) vid.playbackRate = p.rate;

                vid.addEventListener("volumechange", function () {
                    var q = prefs();
                    q.volume = vid.volume;
                    q.muted = vid.muted;
                    savePrefs(q);
                });
                vid.addEventListener("ratechange", function () {
                    var q = prefs();
                    q.rate = vid.playbackRate;
                    savePrefs(q);
                });

                vid.addEventListener("loadedmetadata", function () {
                    el("loading").classList.add("gone");
                    if (isFinite(vid.duration) && vid.duration > 0) addMeta(clock(vid.duration));
                    wireResume();
                });

                vid.addEventListener("loadeddata", function () {
                    if (!vid.videoWidth && !vid.videoHeight) noVideoTrack();
                });

                vid.addEventListener("error", function () {
                    el("loading").classList.add("gone");
                    var e = vid.error;
                    if (e && e.code === 4) {
                        el("frame").classList.add("dead");
                        notice("<b>This browser cannot decode this file.</b> " +
                            (MIME || "The container or codec") +
                            " is not supported here. Pick a player below, or download it.");
                    } else {
                        notice("<b>Playback stopped.</b> The connection dropped or the link " +
                            "expired. Reload the page, or pick a player below.");
                    }
                });

                if (MIME) vid.setAttribute("type", MIME);
                vid.src = STREAM;

                setTimeout(function () {
                    if (!el("loading").classList.contains("gone")) {
                        el("loadingText").textContent = "Still buffering — large files take a moment";
                    }
                }, 6000);
            }

            el("lights").onclick = function () {
                var on = document.body.classList.toggle("lightsoff");
                this.classList.toggle("on", on);
                this.setAttribute("aria-pressed", on ? "true" : "false");
                this.title = on ? "Lights on" : "Lights off";
                this.setAttribute("aria-label", this.title);
            };
            el("dimmer").onclick = function () { el("lights").click(); };
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape" && document.body.classList.contains("lightsoff")) {
                    el("lights").click();
                }
            });

            el("copy").onclick = function () {
                navigator.clipboard.writeText(location.href).then(
                    function () { toast("Page link copied"); },
                    function () { toast("Copy failed"); });
            };
            el("copyDl").onclick = function () {
                navigator.clipboard.writeText(DIRECT).then(
                    function () { toast("Direct link copied"); },
                    function () { toast("Copy failed"); });
            };

            if (!TOKEN) {
                fatal("Nothing to play", "This link is missing its file reference.");
                return;
            }

            fetch("/api/stream/" + encodeURIComponent(TOKEN), { cache: "no-store" })
                .then(function (r) {
                    if (r.status === 404) throw new Error("gone");
                    if (!r.ok) throw new Error("bad");
                    return r.json();
                })
                .then(start)
                .catch(function (e) {
                    if (e && e.message === "gone") {
                        fatal("This file is no longer available",
                            "It was removed from the source chat, or the link is wrong.");
                    } else {
                        fatal("Could not load this file",
                            "The streaming service did not respond. Try again shortly.");
                    }
                });
        })();
    </script>
</body>

</html>
