<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#00000C">
    <title>Stream — WZML-X</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22.5' fill='%23F5F7FF'/%3E%3Cpath d='M 19.4 42.6 C 20.0 55.4 22.4 66.4 29.8 68.3 C 37.0 70.1 43.2 61.0 45.2 48.8 C 47.5 61.0 53.4 66.6 61.0 68.3 C 68.6 70.0 75.6 55.5 80.6 35.3' fill='none' stroke='%233D87FF' stroke-width='11.1' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Tektur:wght@500;600;700&display=swap"
        rel="stylesheet">
    <style>
        @property --ang {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        :root {
            color-scheme: dark;
            --bg: #00000C;
            --surface: #010116;
            --surface-2: #02021F;
            --line: rgba(42, 95, 208, .3);
            --line-2: #2A5FD0;
            --text: #F5F7FF;
            --muted: #CBD2E5;
            --accent: #3D87FF;
            --accent-2: #5B9DFF;
            --accent-soft: #071D5C;
            --r: 12px;
            --r-frame: 22px;
            --sans: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --display: 'Tektur', 'Montserrat', system-ui, sans-serif;
            --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            font-size: 15px;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: .5;
            background:
                linear-gradient(rgba(42, 95, 208, .16) 1px, transparent 1px) 50% / 12px 12px,
                linear-gradient(90deg, rgba(42, 95, 208, .16) 1px, transparent 1px) 50% / 12px 12px,
                radial-gradient(circle at 50% 16%, rgba(61, 135, 255, .13), transparent 26%),
                radial-gradient(circle at 50% 92%, rgba(7, 29, 92, .5), transparent 42%);
        }

        .glyph {
            position: fixed;
            z-index: 0;
            font-family: var(--display);
            font-size: clamp(12rem, 24vw, 26rem);
            font-weight: 600;
            line-height: .8;
            letter-spacing: -.08em;
            color: #080f26;
            filter: drop-shadow(0 0 42px rgba(0, 0, 12, .9));
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
            animation: fade 1.2s cubic-bezier(.16, 1, .3, 1) both;
        }

        .glyph::before {
            content: attr(data-letter);
            position: absolute;
            inset: 0;
            color: transparent;
            background:
                radial-gradient(circle at 40% 25%, rgba(93, 157, 255, .34), transparent 34%),
                radial-gradient(circle at 60% 75%, rgba(61, 135, 255, .13), transparent 36%),
                linear-gradient(rgba(245, 247, 255, .16), rgba(245, 247, 255, .04));
            -webkit-background-clip: text;
            background-clip: text;
            filter: blur(22px);
            opacity: .9;
            transform: scale(1.06);
        }

        .glyph::after {
            content: attr(data-letter);
            position: absolute;
            inset: 0;
            color: rgba(203, 210, 229, .13);
            text-shadow: 0 0 18px rgba(93, 157, 255, .12), 0 0 60px rgba(0, 0, 12, .92);
            transform: scale(1.01);
        }

        .glyph--w {
            top: 50%;
            left: clamp(.25rem, 1.5vw, 1.75rem);
            transform: translateY(-50%) scaleX(.92);
        }

        .glyph--x {
            top: 50%;
            right: clamp(1rem, 3vw, 3rem);
            transform: translateY(-50%) scaleX(.92);
        }

        @keyframes fade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: .6rem;
            height: 56px;
            padding: 0 clamp(.9rem, 3vw, 2rem);
            background: rgba(1, 1, 22, .72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--line);
        }

        .topbar svg {
            width: 24px;
            height: 24px;
            flex: none;
            border-radius: 6px;
        }

        .wordmark {
            font-family: var(--display);
            font-weight: 700;
            font-size: .95rem;
            letter-spacing: .06em;
        }

        .wordmark a {
            color: var(--text);
            text-decoration: none;
        }

        .now {
            margin-left: auto;
            font-family: var(--mono);
            font-size: .7rem;
            letter-spacing: .08em;
            color: var(--muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 48%;
        }

        .page {
            position: relative;
            z-index: 1;
            max-width: 1320px;
            margin: 0 auto;
            padding: clamp(1rem, 2.5vw, 1.75rem) clamp(.7rem, 2.5vw, 1.75rem) 3rem;
        }

        .rise {
            animation: rise .5s cubic-bezier(.16, 1, .3, 1) both;
        }

        .rise:nth-child(2) { animation-delay: .05s; }
        .rise:nth-child(3) { animation-delay: .1s; }

        @keyframes rise {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: none; }
        }

        .stage {
            display: flex;
            justify-content: center;
        }

        .frame {
            position: relative;
            width: min(1240px, 100%);
        }

        .frame::before {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: calc(var(--r-frame) + 4px);
            background: conic-gradient(from var(--ang),
                    #3D87FF, #22D3EE, #7C5CFF, #F5F7FF, #3D87FF);
            filter: blur(22px);
            opacity: 0;
            transition: opacity .4s ease;
            pointer-events: none;
        }

        .frame:hover::before,
        .frame:focus-within::before {
            opacity: .68;
            animation: hue 7s linear infinite;
        }

        @keyframes hue {
            to { --ang: 360deg; }
        }

        .shell {
            position: relative;
            aspect-ratio: 16 / 9;
            border-radius: var(--r-frame);
            overflow: hidden;
            background: #000208;
            box-shadow:
                0 24px 80px rgba(0, 0, 12, .78),
                0 0 0 1px rgba(42, 95, 208, .34);
        }

        .frame.dead {
            display: none;
        }

        video-player {
            display: block;
            width: 100%;
            height: 100%;
            --media-accent-color: #3D87FF;
            --media-accent-text-color: #00000C;
            --media-border-radius: 8px;
            --media-scale-unit: 16px;
            --media-object-fit: contain;
        }

        video-skin {
            display: block;
            width: 100%;
            height: 100%;
            aspect-ratio: 16 / 9;
        }

        .shell video {
            width: 100%;
            height: 100%;
            background: #000;
        }

        .loading {
            position: absolute;
            inset: 0;
            z-index: 3;
            display: grid;
            place-items: center;
            background: linear-gradient(rgba(0, 0, 12, .96), rgba(0, 0, 12, .99));
            transition: opacity .25s ease, visibility .25s ease;
        }

        .loading.gone {
            opacity: 0;
            visibility: hidden;
        }

        .load-copy {
            text-align: center;
            max-width: 22rem;
            padding: 0 1rem;
        }

        .load-copy b {
            display: block;
            font-family: var(--display);
            font-weight: 600;
            font-size: .95rem;
            letter-spacing: .04em;
        }

        .load-copy span {
            display: block;
            margin-top: .25rem;
            font-size: .82rem;
            color: var(--muted);
        }

        .bar {
            height: 2px;
            width: 9rem;
            margin: .85rem auto 0;
            border-radius: 2px;
            background: rgba(93, 157, 255, .18);
            overflow: hidden;
        }

        .bar::after {
            content: "";
            display: block;
            width: 40%;
            height: 100%;
            border-radius: 2px;
            background: var(--accent);
            animation: sweep 1.4s ease-in-out infinite;
        }

        @keyframes sweep {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }

        .head {
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            margin-top: 1.15rem;
            flex-wrap: wrap;
        }

        .head .txt {
            min-width: 0;
            flex: 1 1 20rem;
        }

        h1 {
            font-size: clamp(1.05rem, 1.8vw, 1.3rem);
            font-weight: 700;
            letter-spacing: .01em;
            margin: 0 0 .3rem;
            overflow-wrap: anywhere;
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: .35rem .7rem;
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
            font-size: .74rem;
            color: var(--muted);
        }

        .meta i {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--line-2);
        }

        .acts {
            display: flex;
            gap: .35rem;
            flex: 0 0 auto;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: .4rem;
            height: 34px;
            padding: 0 .7rem;
            border-radius: var(--r);
            border: 1px solid var(--line);
            background: var(--surface-2);
            color: var(--text);
            font: inherit;
            font-size: .78rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            white-space: nowrap;
            transition: border-color .16s ease, background .16s ease, transform .12s ease;
        }

        .btn:hover {
            border-color: var(--line-2);
            background: var(--accent-soft);
        }

        .btn:active {
            transform: scale(.97);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            flex: none;
        }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #00000C;
            font-weight: 600;
        }

        .btn.primary:hover {
            background: var(--accent-2);
            border-color: var(--accent-2);
        }

        .btn.icon {
            width: 34px;
            padding: 0;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: .4rem .5rem;
            margin-top: 1rem;
            padding-top: .9rem;
            border-top: 1px solid var(--line);
        }

        .field {
            display: none;
            align-items: center;
            gap: .35rem;
        }

        .field.show {
            display: inline-flex;
        }

        .field span {
            font-family: var(--mono);
            font-size: .66rem;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: var(--muted);
        }

        select {
            font: inherit;
            font-size: .78rem;
            height: 34px;
            color: var(--text);
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: var(--r);
            padding: 0 .5rem;
            max-width: 13rem;
            cursor: pointer;
        }

        select:hover {
            border-color: var(--line-2);
        }

        select:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .spacer {
            flex: 1 1 auto;
        }

        .notice {
            display: none;
            align-items: flex-start;
            gap: .6rem;
            border: 1px solid rgba(42, 95, 208, .45);
            border-radius: var(--r);
            background: rgba(7, 29, 92, .6);
            padding: .7rem .85rem;
            margin-bottom: .9rem;
            font-size: .84rem;
        }

        .notice.show {
            display: flex;
        }

        .notice svg {
            width: 16px;
            height: 16px;
            fill: var(--accent-2);
            flex: none;
            margin-top: .15rem;
        }

        .resume {
            display: none;
            align-items: center;
            gap: .5rem;
            flex-wrap: wrap;
            margin-top: .9rem;
            font-size: .82rem;
            color: var(--muted);
        }

        .resume.show {
            display: flex;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 1.3rem;
            transform: translate(-50%, 1.5rem);
            background: rgba(1, 1, 22, .95);
            border: 1px solid var(--line-2);
            border-radius: 999px;
            padding: .45rem 1rem;
            font-size: .8rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
            z-index: 60;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .err {
            text-align: center;
            padding: 4rem 1rem;
        }

        .err h2 {
            font-family: var(--display);
            font-weight: 700;
            letter-spacing: .02em;
            margin: 0 0 .5rem;
        }

        .err p {
            color: var(--muted);
            margin: 0 0 1.3rem;
        }

        @media (max-width: 900px) {
            .glyph {
                font-size: clamp(11rem, 34vmin, 19rem);
            }

            .glyph--w {
                top: 1rem;
                left: clamp(.5rem, 6vw, 2.5rem);
                transform: none;
            }

            .glyph--x {
                top: auto;
                bottom: 2.4rem;
                right: clamp(.6rem, 4vw, 2.2rem);
                transform: none;
            }
        }

        @media (max-width: 640px) {
            .page {
                padding-left: .6rem;
                padding-right: .6rem;
            }

            .shell {
                border-radius: 14px;
            }

            video-player {
                --media-scale-unit: 14px;
            }

            .glyph {
                font-size: clamp(9rem, 38vmin, 15rem);
            }

            .now {
                display: none;
            }

            .acts {
                width: 100%;
            }

            .acts .btn:first-child {
                flex: 1 1 auto;
            }

            select {
                max-width: 100%;
                flex: 1 1 8rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation: none !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="glyph glyph--w" data-letter="W" aria-hidden="true">W</div>
    <div class="glyph glyph--x" data-letter="X" aria-hidden="true">X</div>

    <header class="topbar">
        <svg viewBox="0 0 100 100" aria-hidden="true">
            <rect width="100" height="100" rx="22.5" fill="#F5F7FF" />
            <path
                d="M 19.4 42.6 C 20.0 55.4 22.4 66.4 29.8 68.3 C 37.0 70.1 43.2 61.0 45.2 48.8 C 47.5 61.0 53.4 66.6 61.0 68.3 C 68.6 70.0 75.6 55.5 80.6 35.3"
                fill="none" stroke="#3D87FF" stroke-width="11.1" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="wordmark"><a href="/">WZML-X</a></span>
        <span class="now" id="now"></span>
    </header>

    <main class="page" id="root">
        <div class="notice rise" id="notice">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2 1 21h22L12 2zm0 6 6.5 11h-13L12 8zm-1 3v4h2v-4h-2zm0 5v2h2v-2h-2z" />
            </svg>
            <div id="noticeText"></div>
        </div>

        <div class="stage rise">
            <div class="frame" id="frame">
                <div class="shell">
                    <video-player>
                        <video-skin>
                            <video id="player" playsinline preload="metadata"></video>
                        </video-skin>
                    </video-player>
                    <div class="loading" id="loading">
                        <div class="load-copy">
                            <b>Opening the stream</b>
                            <span id="loadingText">Reaching Telegram</span>
                            <div class="bar"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="rise">
            <div class="head">
                <div class="txt">
                    <h1 id="title">Loading…</h1>
                    <div class="meta" id="meta"></div>
                </div>
                <div class="acts">
                    <a class="btn primary" id="dl" href="#" download>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 3v10.6l3.3-3.3 1.4 1.4L12 17.4l-4.7-4.7 1.4-1.4 3.3 3.3V3h2zM5 19h14v2H5v-2z" />
                        </svg>
                        Download
                    </a>
                    <button class="btn icon" type="button" id="copy" title="Copy page link"
                        aria-label="Copy page link">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z" />
                        </svg>
                    </button>
                    <button class="btn icon" type="button" id="copyDl" title="Copy direct link"
                        aria-label="Copy direct link">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path
                                d="M3.9 12a3.1 3.1 0 0 1 3.1-3.1h4V7H7a5 5 0 0 0 0 10h4v-1.9H7A3.1 3.1 0 0 1 3.9 12zM8 13h8v-2H8v2zm9-6h-4v1.9h4a3.1 3.1 0 0 1 0 6.2h-4V17h4a5 5 0 0 0 0-10z" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="resume" id="resume">
                <span id="resumeText"></span>
                <button class="btn" type="button" id="resumeGo">Resume</button>
                <button class="btn" type="button" id="resumeNo">Start over</button>
            </div>

            <div class="controls">
                <label class="field" id="audField">
                    <span>Audio</span>
                    <select id="audSel"></select>
                </label>
                <label class="field" id="subField">
                    <span>Subtitles</span>
                    <select id="subSel"></select>
                </label>
                <div class="spacer"></div>
                <select id="appSel" aria-label="Open in an external player"></select>
            </div>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/html@10.0.0-beta.31/cdn/video.js"></script>
    <script>
        (function () {
            "use strict";

            var TOKEN = (location.pathname.split("/").filter(Boolean).pop() || "");
            var STREAM = location.origin + "/stream/" + encodeURIComponent(TOKEN);
            var DIRECT = location.origin + "/dl/" + encodeURIComponent(TOKEN);
            var POS_KEY = "wzx:pos:" + TOKEN;
            var PREF_KEY = "wzx:prefs";

            var el = function (id) { return document.getElementById(id); };
            var vid = el("player");
            var FILE = "Video";

            function store(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
            function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
            function prefs() { try { return JSON.parse(load(PREF_KEY) || "{}"); } catch (e) { return {}; } }
            function savePrefs(p) { store(PREF_KEY, JSON.stringify(p)); }

            function toast(text) {
                var t = el("toast");
                t.textContent = text;
                t.classList.add("show");
                setTimeout(function () { t.classList.remove("show"); }, 1800);
            }

            function bytes(n) {
                if (!n) return "unknown size";
                var u = ["B", "KB", "MB", "GB", "TB"], i = 0, v = n;
                while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
                return (i === 0 ? v : v.toFixed(v < 10 ? 2 : 1)) + " " + u[i];
            }

            function clock(s) {
                if (!isFinite(s) || s <= 0) return "";
                s = Math.floor(s);
                var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), q = s % 60;
                var pad = function (x) { return x < 10 ? "0" + x : "" + x; };
                return (h ? h + ":" + pad(m) : "" + m) + ":" + pad(q);
            }

            function notice(html) {
                el("noticeText").innerHTML = html;
                el("notice").classList.add("show");
            }

            function fatal(head, body) {
                el("root").innerHTML = '<div class="err"><h2></h2><p></p>' +
                    '<p><a class="btn primary" href="/">Back to WZML-X</a></p></div>';
                el("root").querySelector("h2").textContent = head;
                el("root").querySelector("p").textContent = body;
            }

            function detectOS() {
                var ua = navigator.userAgent || "";
                if (/android/i.test(ua)) return "android";
                if (/iPad|iPhone|iPod/.test(ua)) return "ios";
                if (/Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1) return "ios";
                if (/Macintosh|Mac OS X/.test(ua)) return "mac";
                return "desktop";
            }

            function m3u() {
                var text = "#EXTM3U\n#EXTINF:-1," + FILE + "\n" + STREAM + "\n";
                return "data:audio/x-mpegurl;charset=utf-8," + encodeURIComponent(text);
            }

            function intent(pkg) {
                return "intent:" + STREAM + "#Intent;package=" + pkg +
                    ";type=video/*;S.title=" + encodeURIComponent(FILE) + ";end";
            }

            function catalogue() {
                var enc = encodeURIComponent(STREAM);
                var b64 = "";
                try { b64 = btoa(STREAM); } catch (e) { b64 = ""; }
                return {
                    android: [
                        ["VLC", intent("org.videolan.vlc")],
                        ["MX Player", intent("com.mxtech.videoplayer.ad")],
                        ["MX Player Pro", intent("com.mxtech.videoplayer.pro")],
                        ["nPlayer", intent("com.newin.nplayer.pro")],
                        ["Just Player", intent("com.brouken.player")],
                        ["Kodi", intent("org.xbmc.kodi")],
                        ["Web Video Cast", intent("com.instantbits.cast.webvideo")],
                        ["Any player", "intent:" + STREAM + "#Intent;type=video/*;end"]
                    ],
                    ios: [
                        ["Infuse", "infuse://x-callback-url/play?url=" + enc],
                        ["VLC", "vlc-x-callback://x-callback-url/stream?url=" + enc],
                        ["nPlayer", "nplayer-" + STREAM],
                        ["Outplayer", "outplayer://" + STREAM],
                        ["SenPlayer", "senplayer://x-callback-url/play?url=" + enc],
                        ["VidHub", "open-vidhub://x-callback-url/open?url=" + enc],
                        ["KMPlayer", "kmplayer://" + STREAM],
                        ["PlayerXtreme", "playerxtreme://" + STREAM]
                    ],
                    mac: [
                        ["IINA", "iina://weblink?url=" + enc],
                        ["VLC", "vlc://" + STREAM],
                        ["Infuse", "infuse://x-callback-url/play?url=" + enc],
                        ["nPlayer", "nplayer-" + STREAM],
                        ["VidHub", "open-vidhub://x-callback-url/open?url=" + enc],
                        ["Playlist file (.m3u)", m3u()]
                    ],
                    desktop: [
                        ["VLC", "vlc://" + STREAM],
                        ["PotPlayer", "potplayer://" + STREAM],
                        ["MPC-HC", "mpc-hc://" + STREAM],
                        ["Kodi", b64 ? "kodi://" + STREAM : "kodi://"],
                        ["Playlist file (.m3u)", m3u()]
                    ]
                };
            }

            var OS_LABEL = {
                android: "Android",
                ios: "iOS / iPadOS",
                mac: "macOS",
                desktop: "Windows / Linux"
            };

            function buildApps() {
                var sel = el("appSel");
                var cat = catalogue();
                var here = detectOS();
                var order = [here].concat(["android", "ios", "mac", "desktop"].filter(
                    function (k) { return k !== here; }));
                sel.innerHTML = "";
                var ph = document.createElement("option");
                ph.value = "";
                ph.textContent = "Open in an app…";
                sel.appendChild(ph);
                order.forEach(function (osKey) {
                    var g = document.createElement("optgroup");
                    g.label = OS_LABEL[osKey];
                    cat[osKey].forEach(function (pair) {
                        var o = document.createElement("option");
                        o.value = pair[1];
                        o.textContent = pair[0];
                        if (pair[0].indexOf(".m3u") !== -1) o.dataset.file = "1";
                        g.appendChild(o);
                    });
                    sel.appendChild(g);
                });
                sel.onchange = function () {
                    var opt = sel.options[sel.selectedIndex];
                    if (!sel.value) return;
                    if (opt.dataset.file) {
                        var a = document.createElement("a");
                        a.href = sel.value;
                        a.download = FILE + ".m3u";
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                    } else {
                        window.location.href = sel.value;
                    }
                    sel.selectedIndex = 0;
                };
            }

            function fill(sel, items, current) {
                sel.innerHTML = "";
                items.forEach(function (it) {
                    var o = document.createElement("option");
                    o.value = it.value;
                    o.textContent = it.label;
                    if (it.value === current) o.selected = true;
                    sel.appendChild(o);
                });
            }

            function tracksOf(list, kinds) {
                var out = [];
                if (!list) return out;
                for (var i = 0; i < list.length; i++) {
                    if (kinds && kinds.indexOf(list[i].kind) === -1) continue;
                    out.push({ i: i, t: list[i] });
                }
                return out;
            }

            function wireTracks() {
                var texts = vid.textTracks;
                var audios = vid.audioTracks;

                var subs = tracksOf(texts, ["subtitles", "captions"]);
                var subSel = el("subSel");
                if (subs.length) {
                    var items = [{ value: "-1", label: "Off" }], active = "-1";
                    subs.forEach(function (e) {
                        items.push({
                            value: String(e.i),
                            label: e.t.label || e.t.language || "Track " + (e.i + 1)
                        });
                        if (e.t.mode === "showing") active = String(e.i);
                    });
                    fill(subSel, items, active);
                    subSel.onchange = function () {
                        var pick = parseInt(subSel.value, 10);
                        for (var i = 0; i < texts.length; i++) {
                            texts[i].mode = (i === pick) ? "showing" : "disabled";
                        }
                        var q = prefs();
                        q.sub = subSel.options[subSel.selectedIndex].textContent;
                        savePrefs(q);
                    };
                    el("subField").classList.add("show");
                } else {
                    el("subField").classList.remove("show");
                }

                var auds = tracksOf(audios, null);
                var audSel = el("audSel");
                if (auds.length > 1) {
                    var list = [], cur = "0";
                    auds.forEach(function (e) {
                        list.push({
                            value: String(e.i),
                            label: e.t.label || e.t.language || "Track " + (e.i + 1)
                        });
                        if (e.t.enabled) cur = String(e.i);
                    });
                    fill(audSel, list, cur);
                    audSel.onchange = function () {
                        var pick = parseInt(audSel.value, 10);
                        for (var j = 0; j < audios.length; j++) {
                            audios[j].enabled = (j === pick);
                        }
                        var q = prefs();
                        q.aud = audSel.options[audSel.selectedIndex].textContent;
                        savePrefs(q);
                    };
                    el("audField").classList.add("show");
                } else {
                    el("audField").classList.remove("show");
                }
            }

            function wireResume() {
                var saved = parseFloat(load(POS_KEY) || "0");
                var dur = vid.duration;
                if (saved > 30 && isFinite(dur) && saved < dur - 30) {
                    el("resumeText").textContent = "Stopped at " + clock(saved);
                    el("resume").classList.add("show");
                    el("resumeGo").onclick = function () {
                        vid.currentTime = saved;
                        el("resume").classList.remove("show");
                        vid.play();
                    };
                    el("resumeNo").onclick = function () {
                        store(POS_KEY, "0");
                        el("resume").classList.remove("show");
                    };
                }
                var last = 0;
                vid.addEventListener("timeupdate", function () {
                    var now = vid.currentTime;
                    if (Math.abs(now - last) < 5) return;
                    last = now;
                    store(POS_KEY, String(now));
                });
                vid.addEventListener("ended", function () { store(POS_KEY, "0"); });
            }

            function addMeta(text) {
                var box = el("meta");
                if (box.children.length) box.appendChild(document.createElement("i"));
                var s = document.createElement("span");
                s.textContent = text;
                box.appendChild(s);
            }

            function start(info) {
                FILE = info.name || "Untitled";
                document.title = FILE + " — WZML-X";
                el("title").textContent = FILE;
                el("now").textContent = FILE;
                el("dl").href = DIRECT;
                el("dl").setAttribute("download", FILE);
                buildApps();
                addMeta(bytes(info.size));
                if (info.mime) addMeta(info.mime);

                var p = prefs();
                if (typeof p.volume === "number") vid.volume = p.volume;
                if (p.muted) vid.muted = true;
                if (typeof p.rate === "number" && p.rate > 0) vid.playbackRate = p.rate;

                vid.addEventListener("volumechange", function () {
                    var q = prefs();
                    q.volume = vid.volume;
                    q.muted = vid.muted;
                    savePrefs(q);
                });
                vid.addEventListener("ratechange", function () {
                    var q = prefs();
                    q.rate = vid.playbackRate;
                    savePrefs(q);
                });

                vid.addEventListener("loadedmetadata", function () {
                    el("loading").classList.add("gone");
                    if (isFinite(vid.duration) && vid.duration > 0) addMeta(clock(vid.duration));
                    wireTracks();
                    wireResume();
                });

                if (vid.textTracks) vid.textTracks.addEventListener("addtrack", wireTracks);
                if (vid.audioTracks) vid.audioTracks.addEventListener("addtrack", wireTracks);

                vid.addEventListener("error", function () {
                    el("loading").classList.add("gone");
                    var e = vid.error;
                    if (e && e.code === 4) {
                        el("frame").classList.add("dead");
                        notice("<b>This browser cannot decode this file.</b> " +
                            (info.mime || "The container or codec") +
                            " is not supported here. Pick a player below, or download it.");
                    } else {
                        notice("<b>Playback stopped.</b> The connection dropped or the link " +
                            "expired. Reload the page, or pick a player below.");
                    }
                });

                if (info.mime) vid.setAttribute("type", info.mime);
                vid.src = STREAM;

                setTimeout(function () {
                    if (!el("loading").classList.contains("gone")) {
                        el("loadingText").textContent = "Still buffering — large files take a moment";
                    }
                }, 6000);
            }

            el("copy").onclick = function () {
                navigator.clipboard.writeText(location.href).then(
                    function () { toast("Page link copied"); },
                    function () { toast("Copy failed"); });
            };
            el("copyDl").onclick = function () {
                navigator.clipboard.writeText(DIRECT).then(
                    function () { toast("Direct link copied"); },
                    function () { toast("Copy failed"); });
            };

            if (!TOKEN) {
                fatal("Nothing to play", "This link is missing its file reference.");
                return;
            }

            fetch("/api/stream/" + encodeURIComponent(TOKEN), { cache: "no-store" })
                .then(function (r) {
                    if (r.status === 404) throw new Error("gone");
                    if (!r.ok) throw new Error("bad");
                    return r.json();
                })
                .then(start)
                .catch(function (e) {
                    if (e && e.message === "gone") {
                        fatal("This file is no longer available",
                            "It was removed from the source chat, or the link is wrong.");
                    } else {
                        fatal("Could not load this file",
                            "The streaming service did not respond. Try again shortly.");
                    }
                });
        })();
    </script>
</body>

</html>
