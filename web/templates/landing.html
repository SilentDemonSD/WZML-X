    <meta property="og:title" content="WZML-X">
    <meta property="og:description" content="Experience the next generation of workflow automation.">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08060f;
            --line: rgba(255, 255, 255, 0.07);
            --line-strong: rgba(255, 255, 255, 0.12);
            --deep: #2A1178;
            --mid: #5236CB;
            --light: #907DFB;
            --pale: #B9A9FD;
            --text: #EDEAF6;
            --muted: #8F88AB;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { -webkit-text-size-adjust: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.25rem;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(55rem 34rem at 50% -12%, rgba(82, 54, 203, 0.32) 0%, transparent 70%),
                radial-gradient(38rem 28rem at 8% 104%, rgba(42, 17, 120, 0.38) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 76px 76px;
            mask-image: radial-gradient(46rem 36rem at 50% 26%, #000 0%, transparent 78%);
            -webkit-mask-image: radial-gradient(46rem 36rem at 50% 26%, #000 0%, transparent 78%);
            opacity: 0.45;
            pointer-events: none;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 44rem;
            text-align: center;
            padding: 3rem 2.75rem 1.75rem;
            border-radius: 26px;
            background: linear-gradient(180deg, rgba(24, 16, 46, 0.9), rgba(10, 7, 20, 0.92));
            border: 1px solid var(--line-strong);
            box-shadow: 0 32px 80px -24px rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(24px);
            animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(185, 169, 253, 0.6), transparent);
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: none; }
        }

        .logo {
            width: 76px;
            height: 76px;
            display: block;
            margin: 0 auto 1.5rem;
            border-radius: 18px;
            box-shadow: 0 18px 44px -14px rgba(82, 54, 203, 0.85);
        }

        h1 {
            font-size: clamp(2.25rem, 7vw, 3rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.05;
            background: linear-gradient(180deg, #FFFFFF 30%, var(--pale) 130%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .version {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 0.6rem;
        }

        .subtitle {
            font-size: 1.0625rem;
            color: var(--muted);
            max-width: 28rem;
            margin: 1rem auto 0;
        }

        .links {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
            margin-top: 2.5rem;
            text-align: left;
        }

        .button {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.95rem 1.15rem;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.035);
            border: 1px solid var(--line);
            color: var(--text);
            text-decoration: none;
            font-size: 0.9375rem;
            font-weight: 500;
            transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
        }

        .button .ico {
            width: 2.1rem;
            height: 2.1rem;
            flex: none;
            display: grid;
            place-items: center;
            border-radius: 11px;
            color: var(--pale);
            background: rgba(144, 125, 251, 0.12);
            transition: background 0.2s ease, color 0.2s ease;
        }

        .button .ico svg {
            width: 1.05rem;
            height: 1.05rem;
            display: block;
        }

        .button .arrow {
            margin-left: auto;
            display: grid;
            place-items: center;
            color: var(--muted);
            opacity: 0;
            transform: translateX(-5px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .button .arrow svg {
            width: 0.95rem;
            height: 0.95rem;
            display: block;
        }

        .button:hover {
            background: rgba(144, 125, 251, 0.08);
            border-color: rgba(144, 125, 251, 0.4);
            transform: translateY(-2px);
        }

        .button:hover .ico {
            background: linear-gradient(135deg, var(--mid), var(--light));
            color: #fff;
        }

        .button:hover .arrow {
            opacity: 1;
            transform: none;
        }

        .button:focus-visible {
            outline: 2px solid var(--light);
            outline-offset: 3px;
        }

        .footer {
            margin-top: 2.25rem;
            padding-top: 1.4rem;
            border-top: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            font-size: 0.8125rem;
            color: var(--muted);
        }

        .footer .tagline { color: var(--pale); font-weight: 500; }

        @media (max-width: 640px) {
            .card { padding: 2.25rem 1.4rem 1.5rem; }
            .links { grid-template-columns: 1fr; }
            .footer { flex-direction: column; text-align: center; gap: 0.4rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
